<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1028" width="600" height="1028" role="img" aria-labelledby="t d">
<title id="t">Only a crawlable link does all three jobs</title>
<desc id="d">Comparison matrix of what an internal link does and whether its common substitutes do the same, with three columns: discovery, importance and anchor text. HTML link with an href, in content, menus and listings: discovery yes, Google extracts it to find new pages; importance yes, pages linked from the home page are seen as more important; anchor text yes, its words describe the page it points to. XML sitemap entry: discovery yes, it helps discovery but crawling is not guaranteed; importance no, Google points to internal links for importance; anchor text no, a sitemap entry has no anchor text. Breadcrumb structured data, URLs in schema markup: not used in the same way as normal internal links on a page. Link without an href, such as an onclick handler or clickable span: generally not parsed or extracted by Google’s crawlers. Footer quote from Google: Every page you care about should have a link from at least one other page on your site.</desc>
<style>
.bg{fill:#0e192a}
.panel{fill:#111d30;stroke:#26374b;stroke-width:2}
.panel-a{fill:#111d30;stroke:#77e3c4;stroke-width:2.5}
.title{fill:#ecf2fa;font:700 30px Arial,Helvetica,sans-serif}
.sub{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.h{fill:#77e3c4;font:700 13px Arial,Helvetica,sans-serif;letter-spacing:1.5px}
.t{fill:#ecf2fa;font:700 18px Arial,Helvetica,sans-serif}
.ts{fill:#ecf2fa;font:700 16px Arial,Helvetica,sans-serif}
.m{fill:#a9b8c9;font:500 15px Arial,Helvetica,sans-serif}
.ms{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.mw{fill:#d0dbe8;font:500 15px Arial,Helvetica,sans-serif}
.yes{fill:#77e3c4;font:700 15px Arial,Helvetica,sans-serif}
.no{fill:#a9b8c9;font:700 15px Arial,Helvetica,sans-serif}
.note{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.tick{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.va{fill:#77e3c4;font:700 16px Arial,Helvetica,sans-serif}
.vg{fill:#a9b8c9;font:700 16px Arial,Helvetica,sans-serif}
.grid{stroke:#26374b;stroke-width:1}
.base{stroke:#6f8196;stroke-width:1.5}
.bar{fill:#77e3c4}
.bar-l{fill:#77e3c4;fill-opacity:.45}
.bar-g{fill:#6f8196}
.med{fill:#0e192a;stroke:#ecf2fa;stroke-width:2.5}
.ic-y{fill:none;stroke:#77e3c4;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ic-n{fill:none;stroke:#6f8196;stroke-width:2.5;stroke-linecap:round}
.ring-y{fill:#0e192a;stroke:#77e3c4;stroke-width:2}
.ring-n{fill:#0e192a;stroke:#6f8196;stroke-width:2}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="30.0" y="50.0" class="title" text-anchor="start">Only a crawlable link does all three</text>
<text x="30.0" y="86.0" class="title" text-anchor="start">jobs</text>
<text x="30.0" y="122.0" class="sub" text-anchor="start">What an internal link does, compared with its common substitutes.</text>
<rect x="30" y="160" width="540" height="221" rx="12" class="panel"/>
<text x="48.0" y="194.0" class="t" text-anchor="start">HTML link with an href</text>
<text x="48.0" y="216.0" class="ms" text-anchor="start">In content, menus and listings</text>
<circle cx="59" cy="251" r="11" class="ring-y"/><path d="M54 251 l3.5 4 l6.5 -8" class="ic-y"/>
<text x="80.0" y="256.0" class="yes" text-anchor="start">Discovery: Yes</text>
<text x="80.0" y="275.0" class="ms" text-anchor="start">Google extracts it to find new pages</text>
<circle cx="59" cy="294" r="11" class="ring-y"/><path d="M54 294 l3.5 4 l6.5 -8" class="ic-y"/>
<text x="80.0" y="299.0" class="yes" text-anchor="start">Importance: Yes</text>
<text x="80.0" y="318.0" class="ms" text-anchor="start">Pages linked from the home page seen as more important</text>
<circle cx="59" cy="337" r="11" class="ring-y"/><path d="M54 337 l3.5 4 l6.5 -8" class="ic-y"/>
<text x="80.0" y="342.0" class="yes" text-anchor="start">Anchor text: Yes</text>
<text x="80.0" y="361.0" class="ms" text-anchor="start">Words describe the page it points to</text>
<rect x="30" y="393" width="540" height="221" rx="12" class="panel"/>
<text x="48.0" y="427.0" class="t" text-anchor="start">XML sitemap entry</text>
<text x="48.0" y="449.0" class="ms" text-anchor="start">Listed in a sitemap file</text>
<circle cx="59" cy="484" r="11" class="ring-y"/><path d="M54 484 l3.5 4 l6.5 -8" class="ic-y"/>
<text x="80.0" y="489.0" class="yes" text-anchor="start">Discovery: Yes</text>
<text x="80.0" y="508.0" class="ms" text-anchor="start">Helps discovery; crawling not guaranteed</text>
<circle cx="59" cy="527" r="11" class="ring-n"/><path d="M54.5 522.5 l9 9 M63.5 522.5 l-9 9" class="ic-n"/>
<text x="80.0" y="532.0" class="no" text-anchor="start">Importance: No</text>
<text x="80.0" y="551.0" class="ms" text-anchor="start">Google points to internal links for importance</text>
<circle cx="59" cy="570" r="11" class="ring-n"/><path d="M54.5 565.5 l9 9 M63.5 565.5 l-9 9" class="ic-n"/>
<text x="80.0" y="575.0" class="no" text-anchor="start">Anchor text: No</text>
<text x="80.0" y="594.0" class="ms" text-anchor="start">A sitemap entry has no anchor text</text>
<rect x="30" y="626" width="540" height="135" rx="12" class="panel"/>
<text x="48.0" y="660.0" class="t" text-anchor="start">Breadcrumb structured data</text>
<text x="48.0" y="682.0" class="ms" text-anchor="start">URLs in schema markup</text>
<circle cx="59" cy="717" r="11" class="ring-n"/><path d="M54.5 712.5 l9 9 M63.5 712.5 l-9 9" class="ic-n"/>
<text x="80.0" y="722.0" class="no" text-anchor="start">Not a substitute</text>
<text x="80.0" y="741.0" class="ms" text-anchor="start">Not used in the same way as normal internal links on a page</text>
<rect x="30" y="773" width="540" height="135" rx="12" class="panel"/>
<text x="48.0" y="807.0" class="t" text-anchor="start">Link without an href</text>
<text x="48.0" y="829.0" class="ms" text-anchor="start">onclick handler, clickable span</text>
<circle cx="59" cy="864" r="11" class="ring-n"/><path d="M54.5 859.5 l9 9 M63.5 859.5 l-9 9" class="ic-n"/>
<text x="80.0" y="869.0" class="no" text-anchor="start">Not a substitute</text>
<text x="80.0" y="888.0" class="ms" text-anchor="start">Generally not parsed or extracted by Google’s crawlers</text>
<text x="30.0" y="934.0" class="mw" text-anchor="start">Google: “Every page you care about should have a link from at least one other</text>
<text x="30.0" y="954.0" class="mw" text-anchor="start">page on your site.”</text>
<text x="30.0" y="978.0" class="note" text-anchor="start">Sources: Google link best practices and sitemap documentation; John Mueller, 2021</text>
<text x="30.0" y="997.0" class="note" text-anchor="start">and 2022.</text>
</svg>

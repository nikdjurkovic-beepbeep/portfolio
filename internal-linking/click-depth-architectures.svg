<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 568" width="1000" height="568" role="img" aria-labelledby="t d">
<title id="t">The same 10,000 products, four architectures</title>
<desc id="d">Bar chart of a worked example, not measured data: click depth from the home page for the same 10,000 products, listed 20 per page, under four architectures. A, one category with next and previous links only, 500 listing pages in one chain: deepest product 501 clicks, median product 251.5 clicks. B, one category with numbered pagination linking two pages either side plus the first and last page: deepest 127 clicks, median 65. C, 20 subcategories with the same numbered pagination, 25 listing pages each: deepest 10 clicks, median 7. D, two levels of category pages, 20 subcategories each with 25 categories of 20 products: every product 4 clicks from the home page. Shortest paths calculated by the author; the home page links to the top category.</desc>
<style>
.bg{fill:#0e192a}
.panel{fill:#111d30;stroke:#26374b;stroke-width:2}
.panel-a{fill:#111d30;stroke:#77e3c4;stroke-width:2.5}
.title{fill:#ecf2fa;font:700 30px Arial,Helvetica,sans-serif}
.sub{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.h{fill:#77e3c4;font:700 13px Arial,Helvetica,sans-serif;letter-spacing:1.5px}
.t{fill:#ecf2fa;font:700 18px Arial,Helvetica,sans-serif}
.ts{fill:#ecf2fa;font:700 16px Arial,Helvetica,sans-serif}
.m{fill:#a9b8c9;font:500 15px Arial,Helvetica,sans-serif}
.ms{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.mw{fill:#d0dbe8;font:500 15px Arial,Helvetica,sans-serif}
.yes{fill:#77e3c4;font:700 15px Arial,Helvetica,sans-serif}
.no{fill:#a9b8c9;font:700 15px Arial,Helvetica,sans-serif}
.note{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.tick{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.va{fill:#77e3c4;font:700 16px Arial,Helvetica,sans-serif}
.vg{fill:#a9b8c9;font:700 16px Arial,Helvetica,sans-serif}
.grid{stroke:#26374b;stroke-width:1}
.base{stroke:#6f8196;stroke-width:1.5}
.bar{fill:#77e3c4}
.bar-l{fill:#77e3c4;fill-opacity:.45}
.bar-g{fill:#6f8196}
.med{fill:#0e192a;stroke:#ecf2fa;stroke-width:2.5}
.ic-y{fill:none;stroke:#77e3c4;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ic-n{fill:none;stroke:#6f8196;stroke-width:2.5;stroke-linecap:round}
.ring-y{fill:#0e192a;stroke:#77e3c4;stroke-width:2}
.ring-n{fill:#0e192a;stroke:#6f8196;stroke-width:2}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="40.0" y="50.0" class="title" text-anchor="start">The same 10,000 products, four architectures</text>
<text x="40.0" y="80.0" class="sub" text-anchor="start">Clicks from the home page to the deepest product (bar) and the median product (dot).</text>
<line x1="440.0" y1="124" x2="440.0" y2="466" class="grid"/>
<text x="440.0" y="488.0" class="tick" text-anchor="middle">0</text>
<line x1="534.2" y1="124" x2="534.2" y2="466" class="grid"/>
<text x="534.2" y="488.0" class="tick" text-anchor="middle">100</text>
<line x1="628.5" y1="124" x2="628.5" y2="466" class="grid"/>
<text x="628.5" y="488.0" class="tick" text-anchor="middle">200</text>
<line x1="722.7" y1="124" x2="722.7" y2="466" class="grid"/>
<text x="722.7" y="488.0" class="tick" text-anchor="middle">300</text>
<line x1="816.9" y1="124" x2="816.9" y2="466" class="grid"/>
<text x="816.9" y="488.0" class="tick" text-anchor="middle">400</text>
<line x1="911.2" y1="124" x2="911.2" y2="466" class="grid"/>
<text x="911.2" y="488.0" class="tick" text-anchor="middle">500</text>
<text x="685.0" y="510.0" class="tick" text-anchor="middle">Clicks from the home page</text>
<text x="40.0" y="160.0" class="t" text-anchor="start">A.</text>
<text x="66.0" y="160.0" class="ts" text-anchor="start">One category, next and previous links only</text>
<text x="66.0" y="180.0" class="ms" text-anchor="start">500 listing pages in one chain</text>
<rect x="440" y="148" width="472.1" height="28" rx="4" class="bar"/>
<circle cx="677.0" cy="162.0" r="6" class="med"/>
<text x="902.1" y="198.0" class="va" text-anchor="end">501 max · 251.5 median</text>
<text x="40.0" y="244.0" class="t" text-anchor="start">B.</text>
<text x="66.0" y="244.0" class="ts" text-anchor="start">One category, numbered pagination</text>
<text x="66.0" y="264.0" class="ms" text-anchor="start">Links two pages either side, plus first and last</text>
<rect x="440" y="232" width="119.7" height="28" rx="4" class="bar"/>
<circle cx="501.2" cy="246.0" r="6" class="med"/>
<text x="571.7" y="252.0" class="va" text-anchor="start">127 max · 65 median</text>
<text x="40.0" y="328.0" class="t" text-anchor="start">C.</text>
<text x="66.0" y="328.0" class="ts" text-anchor="start">20 subcategories, numbered pagination</text>
<text x="66.0" y="348.0" class="ms" text-anchor="start">25 listing pages in each subcategory</text>
<rect x="440" y="316" width="9.4" height="28" rx="4" class="bar"/>
<circle cx="446.6" cy="330.0" r="6" class="med"/>
<text x="461.4" y="336.0" class="va" text-anchor="start">10 max · 7 median</text>
<text x="40.0" y="412.0" class="t" text-anchor="start">D.</text>
<text x="66.0" y="412.0" class="ts" text-anchor="start">Two levels of category pages</text>
<text x="66.0" y="432.0" class="ms" text-anchor="start">20 subcategories × 25 categories of 20 products</text>
<rect x="440" y="400" width="3.8" height="28" rx="4" class="bar"/>
<circle cx="443.8" cy="414.0" r="6" class="med"/>
<text x="455.8" y="420.0" class="va" text-anchor="start">4 for every product</text>
<line x1="440" y1="124" x2="440" y2="466" class="base"/>
<text x="40.0" y="544.0" class="note" text-anchor="start">Worked example, not measured data. Shortest path from the home page, which links to the top category. Calculated by the author.</text>
</svg>

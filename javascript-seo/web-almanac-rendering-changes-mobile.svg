<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 762" width="600" height="762" role="img" aria-labelledby="t d">
<title id="t">How often rendering changes SEO elements</title>
<desc id="d">Bar chart from the HTTP Archive Web Almanac 2024 SEO chapter. Canonical tag changed by rendering: 2.1% of mobile pages and 1.9% of desktop pages. Robots directives changed by rendering: 0.3% of mobile pages and 0.4% of desktop pages. Structured data present only after rendering: 2% of mobile and 2% of desktop home pages. Existing structured data altered by JavaScript: 5% of mobile and 6% of desktop home pages.</desc>
<style>
.bg{fill:#0e192a}
.panel{fill:#111d30;stroke:#26374b;stroke-width:2}
.panel-a{fill:#111d30;stroke:#77e3c4;stroke-width:2.5}
.panel-d{fill:#111d30;stroke:#6f8196;stroke-width:2;stroke-dasharray:8 7}
.title{fill:#ecf2fa;font:700 30px Arial,Helvetica,sans-serif}
.sub{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.h{fill:#77e3c4;font:700 14px Arial,Helvetica,sans-serif;letter-spacing:1.5px}
.hd{fill:#a9b8c9;font:700 13px Arial,Helvetica,sans-serif;letter-spacing:1.5px}
.t{fill:#ecf2fa;font:700 18px Arial,Helvetica,sans-serif}
.m{fill:#a9b8c9;font:500 15px Arial,Helvetica,sans-serif}
.mw{fill:#d0dbe8;font:500 15px Arial,Helvetica,sans-serif}
.s{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.v{fill:#ecf2fa;font:700 16px Arial,Helvetica,sans-serif}
.va{fill:#77e3c4;font:700 16px Arial,Helvetica,sans-serif}
.tick{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.note{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.grid{stroke:#26374b;stroke-width:1}
.base{stroke:#6f8196;stroke-width:1.5}
.bar{fill:#77e3c4}
.bar-m{fill:#6f8196}
.arrow{stroke:#77e3c4;stroke-width:3;fill:none}
.arrow-d{stroke:#6f8196;stroke-width:2;fill:none;stroke-dasharray:5 5}
.num{fill:#0e192a;stroke:#77e3c4;stroke-width:2.5}
.numt{fill:#77e3c4;font:700 15px Arial,Helvetica,sans-serif}
.pill{fill:#111d30;stroke:#6f8196;stroke-width:1.5;stroke-dasharray:4 4}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="30" y="50" class="title" text-anchor="start">How often rendering</text>
<text x="30" y="86" class="title" text-anchor="start">changes SEO elements</text>
<text x="30" y="118" class="sub" text-anchor="start">Web Almanac 2024, share of pages</text>
<rect x="30" y="138" width="16" height="16" rx="3" class="bar"/><text x="54" y="151" class="s" text-anchor="start">Mobile</text>
<rect x="130" y="138" width="16" height="16" rx="3" class="bar-m"/><text x="154" y="151" class="s" text-anchor="start">Desktop</text>
<line x1="30.0" y1="176" x2="30.0" y2="682" class="grid"/>
<text x="30.0" y="702" class="tick" text-anchor="middle">0%</text>
<line x1="164.3" y1="176" x2="164.3" y2="682" class="grid"/>
<text x="164.3" y="702" class="tick" text-anchor="middle">2%</text>
<line x1="298.6" y1="176" x2="298.6" y2="682" class="grid"/>
<text x="298.6" y="702" class="tick" text-anchor="middle">4%</text>
<line x1="432.9" y1="176" x2="432.9" y2="682" class="grid"/>
<text x="432.9" y="702" class="tick" text-anchor="middle">6%</text>
<text x="30" y="198" class="v" text-anchor="start">Canonical tag changed</text>
<text x="30" y="220" class="s" text-anchor="start">by rendering</text>
<rect x="30" y="234" width="141.0" height="22" rx="3" class="bar"/>
<text x="179.0" y="251" class="va" text-anchor="start">2.1%</text>
<rect x="30" y="260" width="127.6" height="22" rx="3" class="bar-m"/>
<text x="165.6" y="277" class="v" text-anchor="start">1.9%</text>
<text x="30" y="326" class="v" text-anchor="start">Robots directives changed</text>
<text x="30" y="348" class="s" text-anchor="start">by rendering</text>
<rect x="30" y="362" width="20.1" height="22" rx="3" class="bar"/>
<text x="58.1" y="379" class="va" text-anchor="start">0.3%</text>
<rect x="30" y="388" width="26.9" height="22" rx="3" class="bar-m"/>
<text x="64.9" y="405" class="v" text-anchor="start">0.4%</text>
<text x="30" y="454" class="v" text-anchor="start">Structured data only</text>
<text x="30" y="476" class="s" text-anchor="start">after rendering (home pages)</text>
<rect x="30" y="490" width="134.3" height="22" rx="3" class="bar"/>
<text x="172.3" y="507" class="va" text-anchor="start">2%</text>
<rect x="30" y="516" width="134.3" height="22" rx="3" class="bar-m"/>
<text x="172.3" y="533" class="v" text-anchor="start">2%</text>
<text x="30" y="582" class="v" text-anchor="start">Structured data altered</text>
<text x="30" y="604" class="s" text-anchor="start">by JavaScript (home pages)</text>
<rect x="30" y="618" width="335.7" height="22" rx="3" class="bar"/>
<text x="373.7" y="635" class="va" text-anchor="start">5%</text>
<rect x="30" y="644" width="402.9" height="22" rx="3" class="bar-m"/>
<text x="440.9" y="661" class="v" text-anchor="start">6%</text>
<text x="30" y="744" class="note" text-anchor="start">Source: HTTP Archive, Web Almanac 2024.</text>
</svg>

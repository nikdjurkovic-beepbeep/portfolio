<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d">
<title id="t">How often rendering changes SEO elements</title>
<desc id="d">Bar chart from the HTTP Archive Web Almanac 2024 SEO chapter. Canonical tag changed by rendering: 2.1% of mobile pages and 1.9% of desktop pages. Robots directives changed by rendering: 0.3% of mobile pages and 0.4% of desktop pages. Structured data present only after rendering: 2% of mobile and 2% of desktop home pages. Existing structured data altered by JavaScript: 5% of mobile and 6% of desktop home pages.</desc>
<style>
.bg{fill:#0e192a}
.panel{fill:#111d30;stroke:#26374b;stroke-width:2}
.panel-a{fill:#111d30;stroke:#77e3c4;stroke-width:2.5}
.panel-d{fill:#111d30;stroke:#6f8196;stroke-width:2;stroke-dasharray:8 7}
.title{fill:#ecf2fa;font:700 30px Arial,Helvetica,sans-serif}
.sub{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.h{fill:#77e3c4;font:700 14px Arial,Helvetica,sans-serif;letter-spacing:1.5px}
.hd{fill:#a9b8c9;font:700 13px Arial,Helvetica,sans-serif;letter-spacing:1.5px}
.t{fill:#ecf2fa;font:700 18px Arial,Helvetica,sans-serif}
.m{fill:#a9b8c9;font:500 15px Arial,Helvetica,sans-serif}
.mw{fill:#d0dbe8;font:500 15px Arial,Helvetica,sans-serif}
.s{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.v{fill:#ecf2fa;font:700 16px Arial,Helvetica,sans-serif}
.va{fill:#77e3c4;font:700 16px Arial,Helvetica,sans-serif}
.tick{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.note{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.grid{stroke:#26374b;stroke-width:1}
.base{stroke:#6f8196;stroke-width:1.5}
.bar{fill:#77e3c4}
.bar-m{fill:#6f8196}
.arrow{stroke:#77e3c4;stroke-width:3;fill:none}
.arrow-d{stroke:#6f8196;stroke-width:2;fill:none;stroke-dasharray:5 5}
.num{fill:#0e192a;stroke:#77e3c4;stroke-width:2.5}
.numt{fill:#77e3c4;font:700 15px Arial,Helvetica,sans-serif}
.pill{fill:#111d30;stroke:#6f8196;stroke-width:1.5;stroke-dasharray:4 4}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="40" y="50" class="title" text-anchor="start">How often rendering changes SEO elements</text>
<text x="40" y="80" class="sub" text-anchor="start">Share of pages where JavaScript changed what the raw HTML said, Web Almanac 2024</text>
<line x1="330.0" y1="120" x2="330.0" y2="450" class="grid"/>
<text x="330.0" y="472" class="tick" text-anchor="middle">0%</text>
<line x1="417.1" y1="120" x2="417.1" y2="450" class="grid"/>
<text x="417.1" y="472" class="tick" text-anchor="middle">1%</text>
<line x1="504.3" y1="120" x2="504.3" y2="450" class="grid"/>
<text x="504.3" y="472" class="tick" text-anchor="middle">2%</text>
<line x1="591.4" y1="120" x2="591.4" y2="450" class="grid"/>
<text x="591.4" y="472" class="tick" text-anchor="middle">3%</text>
<line x1="678.6" y1="120" x2="678.6" y2="450" class="grid"/>
<text x="678.6" y="472" class="tick" text-anchor="middle">4%</text>
<line x1="765.7" y1="120" x2="765.7" y2="450" class="grid"/>
<text x="765.7" y="472" class="tick" text-anchor="middle">5%</text>
<line x1="852.9" y1="120" x2="852.9" y2="450" class="grid"/>
<text x="852.9" y="472" class="tick" text-anchor="middle">6%</text>
<line x1="940.0" y1="120" x2="940.0" y2="450" class="grid"/>
<text x="940.0" y="472" class="tick" text-anchor="middle">7%</text>
<rect x="600" y="104" width="16" height="16" rx="3" class="bar"/><text x="624" y="117" class="s" text-anchor="start">Mobile</text>
<rect x="700" y="104" width="16" height="16" rx="3" class="bar-m"/><text x="724" y="117" class="s" text-anchor="start">Desktop</text>
<text x="40" y="156" class="v" text-anchor="start">Canonical tag changed</text>
<text x="40" y="178" class="s" text-anchor="start">by rendering</text>
<rect x="330" y="140" width="183.0" height="22" rx="3" class="bar"/>
<text x="521.0" y="157" class="va" text-anchor="start">2.1%</text>
<rect x="330" y="166" width="165.6" height="22" rx="3" class="bar-m"/>
<text x="503.6" y="183" class="v" text-anchor="start">1.9%</text>
<text x="40" y="236" class="v" text-anchor="start">Robots directives changed</text>
<text x="40" y="258" class="s" text-anchor="start">by rendering</text>
<rect x="330" y="220" width="26.1" height="22" rx="3" class="bar"/>
<text x="364.1" y="237" class="va" text-anchor="start">0.3%</text>
<rect x="330" y="246" width="34.9" height="22" rx="3" class="bar-m"/>
<text x="372.9" y="263" class="v" text-anchor="start">0.4%</text>
<text x="40" y="316" class="v" text-anchor="start">Structured data only</text>
<text x="40" y="338" class="s" text-anchor="start">after rendering (home pages)</text>
<rect x="330" y="300" width="174.3" height="22" rx="3" class="bar"/>
<text x="512.3" y="317" class="va" text-anchor="start">2%</text>
<rect x="330" y="326" width="174.3" height="22" rx="3" class="bar-m"/>
<text x="512.3" y="343" class="v" text-anchor="start">2%</text>
<text x="40" y="396" class="v" text-anchor="start">Structured data altered</text>
<text x="40" y="418" class="s" text-anchor="start">by JavaScript (home pages)</text>
<rect x="330" y="380" width="435.7" height="22" rx="3" class="bar"/>
<text x="773.7" y="397" class="va" text-anchor="start">5%</text>
<rect x="330" y="406" width="522.9" height="22" rx="3" class="bar-m"/>
<text x="860.9" y="423" class="v" text-anchor="start">6%</text>
<line x1="330" y1="120" x2="330" y2="450" class="base"/>
<text x="40" y="505" class="note" text-anchor="start">Source: HTTP Archive, Web Almanac 2024, SEO chapter. Structured data figures are for home pages.</text>
</svg>

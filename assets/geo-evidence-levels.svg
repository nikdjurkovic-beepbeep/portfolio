<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="title desc">
  <title id="title">How strong is the evidence for three GEO practices?</title>
  <desc id="desc">Traditional SEO has the strongest support as an eligibility foundation, evidence-rich content has limited experimental support, and structured data has an observational association but no established causal effect.</desc>
  <rect width="960" height="370" rx="22" fill="#0d1829"/>
  <text x="44" y="52" fill="#77e3c4" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" letter-spacing="2">PRACTICAL PRIORITIES · EVIDENCE LEVELS</text>
  <text x="44" y="84" fill="#ecf2fa" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="700">Build on what the evidence can support today</text>
  <g font-family="Inter,system-ui,sans-serif">
    <g transform="translate(44 115)"><rect width="272" height="206" rx="14" fill="#111d30" stroke="#315c57"/><text x="20" y="35" fill="#77e3c4" font-size="12" font-weight="800" letter-spacing="1">HIGH · FOUNDATION</text><text x="20" y="69" fill="#ecf2fa" font-size="18" font-weight="700">Technical SEO + relevance</text><text x="20" y="103" fill="#a9b8c9" font-size="13">Keep pages crawlable, indexable,</text><text x="20" y="123" fill="#a9b8c9" font-size="13">useful and easy to discover.</text><rect x="20" y="151" width="220" height="10" rx="5" fill="#26374b"/><rect x="20" y="151" width="198" height="10" rx="5" fill="#77e3c4"/><text x="20" y="188" fill="#91a5ba" font-size="11">Supports eligibility; not a GEO-only hack.</text></g>
    <g transform="translate(344 115)"><rect width="272" height="206" rx="14" fill="#111d30" stroke="#5d5238"/><text x="20" y="35" fill="#ffd18a" font-size="12" font-weight="800" letter-spacing="1">MODERATE · CONTEXTUAL</text><text x="20" y="69" fill="#ecf2fa" font-size="18" font-weight="700">Original, evidence-rich content</text><text x="20" y="103" fill="#a9b8c9" font-size="13">Add primary sources, specific data</text><text x="20" y="123" fill="#a9b8c9" font-size="13">and attributable expertise where useful.</text><rect x="20" y="151" width="220" height="10" rx="5" fill="#26374b"/><rect x="20" y="151" width="143" height="10" rx="5" fill="#ffd18a"/><text x="20" y="188" fill="#91a5ba" font-size="11">Experimental gains do not guarantee reach.</text></g>
    <g transform="translate(644 115)"><rect width="272" height="206" rx="14" fill="#111d30" stroke="#59424a"/><text x="20" y="35" fill="#f3aab2" font-size="12" font-weight="800" letter-spacing="1">LOW–MODERATE · UNCERTAIN</text><text x="20" y="69" fill="#ecf2fa" font-size="18" font-weight="700">Structure + accurate schema</text><text x="20" y="103" fill="#a9b8c9" font-size="13">Use semantic HTML and markup that</text><text x="20" y="123" fill="#a9b8c9" font-size="13">matches visible, verifiable page content.</text><rect x="20" y="151" width="220" height="10" rx="5" fill="#26374b"/><rect x="20" y="151" width="99" height="10" rx="5" fill="#f3aab2"/><text x="20" y="188" fill="#91a5ba" font-size="11">Schema's association is not causal proof.</text></g>
  </g>
  <text x="44" y="348" fill="#91a5ba" font-family="Inter,system-ui,sans-serif" font-size="12">Confidence summarizes published evidence as of November 2026, not guaranteed outcome probabilities.</text>
</svg>
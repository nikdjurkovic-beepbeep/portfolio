<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">AI search visibility is a multi-stage pipeline</title>
  <desc id="desc">Five stages from eligibility to retrieval, citation, influence and user outcome, with a separate measurement question at each stage.</desc>
  <rect width="960" height="360" rx="22" fill="#0d1829"/>
  <text x="44" y="52" fill="#77e3c4" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="700" letter-spacing="2">A MULTI-STAGE VISIBILITY PIPELINE</text>
  <text x="44" y="82" fill="#ecf2fa" font-family="Inter,system-ui,sans-serif" font-size="23" font-weight="700">A citation is one signal in a longer journey</text>
  <g font-family="Inter,system-ui,sans-serif">
    <g transform="translate(40 125)"><rect width="158" height="166" rx="14" fill="#111d30" stroke="#315c57"/><circle cx="24" cy="24" r="14" fill="#77e3c4"/><text x="24" y="29" fill="#08151a" font-size="13" font-weight="800" text-anchor="middle">1</text><text x="18" y="61" fill="#ecf2fa" font-size="17" font-weight="700">Eligible</text><text x="18" y="91" fill="#a9b8c9" font-size="13">Can the system</text><text x="18" y="111" fill="#a9b8c9" font-size="13">access the page?</text><text x="18" y="145" fill="#77e3c4" font-size="12" font-weight="700">ACCESS</text></g>
    <path d="M205 208h22m-6-6 7 6-7 6" fill="none" stroke="#77e3c4" stroke-width="2"/>
    <g transform="translate(234 125)"><rect width="158" height="166" rx="14" fill="#111d30" stroke="#315c57"/><circle cx="24" cy="24" r="14" fill="#77e3c4"/><text x="24" y="29" fill="#08151a" font-size="13" font-weight="800" text-anchor="middle">2</text><text x="18" y="61" fill="#ecf2fa" font-size="17" font-weight="700">Retrieved</text><text x="18" y="91" fill="#a9b8c9" font-size="13">Was the page</text><text x="18" y="111" fill="#a9b8c9" font-size="13">selected as a source?</text><text x="18" y="145" fill="#77e3c4" font-size="12" font-weight="700">RETRIEVAL</text></g>
    <path d="M399 208h22m-6-6 7 6-7 6" fill="none" stroke="#77e3c4" stroke-width="2"/>
    <g transform="translate(428 125)"><rect width="158" height="166" rx="14" fill="#14283a" stroke="#77e3c4"/><circle cx="24" cy="24" r="14" fill="#77e3c4"/><text x="24" y="29" fill="#08151a" font-size="13" font-weight="800" text-anchor="middle">3</text><text x="18" y="61" fill="#ecf2fa" font-size="17" font-weight="700">Cited</text><text x="18" y="91" fill="#a9b8c9" font-size="13">Was it named or</text><text x="18" y="111" fill="#a9b8c9" font-size="13">linked in the answer?</text><text x="18" y="145" fill="#77e3c4" font-size="12" font-weight="700">CITATION</text></g>
    <path d="M593 208h22m-6-6 7 6-7 6" fill="none" stroke="#77e3c4" stroke-width="2"/>
    <g transform="translate(622 125)"><rect width="158" height="166" rx="14" fill="#111d30" stroke="#315c57"/><circle cx="24" cy="24" r="14" fill="#77e3c4"/><text x="24" y="29" fill="#08151a" font-size="13" font-weight="800" text-anchor="middle">4</text><text x="18" y="61" fill="#ecf2fa" font-size="17" font-weight="700">Influenced</text><text x="18" y="91" fill="#a9b8c9" font-size="13">Did its facts or</text><text x="18" y="111" fill="#a9b8c9" font-size="13">wording shape the answer?</text><text x="18" y="145" fill="#77e3c4" font-size="12" font-weight="700">ABSORPTION</text></g>
    <path d="M787 208h22m-6-6 7 6-7 6" fill="none" stroke="#77e3c4" stroke-width="2"/>
    <g transform="translate(816 125)"><rect width="104" height="166" rx="14" fill="#111d30" stroke="#315c57"/><circle cx="24" cy="24" r="14" fill="#77e3c4"/><text x="24" y="29" fill="#08151a" font-size="13" font-weight="800" text-anchor="middle">5</text><text x="18" y="61" fill="#ecf2fa" font-size="16" font-weight="700">Action</text><text x="18" y="91" fill="#a9b8c9" font-size="12">Did a person</text><text x="18" y="111" fill="#a9b8c9" font-size="12">visit or convert?</text><text x="18" y="145" fill="#77e3c4" font-size="11" font-weight="700">OUTCOME</text></g>
  </g>
  <text x="44" y="330" fill="#91a5ba" font-family="Inter,system-ui,sans-serif" font-size="13">Measure each stage separately; citation counts alone do not show influence or business impact.</text>
</svg>
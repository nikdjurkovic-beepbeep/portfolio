<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1006" width="600" height="1006" role="img" aria-labelledby="t d">
<title id="t">Schema split tests: uplifts, losses and null results</title>
<desc id="d">Chart of nine SearchPilot SEO split test results on schema markup, 2020 to 2025, as published by SearchPilot. FAQ schema added, 2020, aggregate of several sites: 67% of tests positive, with uplifts of 4% to 15%. Review and price schema removed so FAQ snippets could show, 2020: minus 5% organic traffic. Review and price schema with reviews shown on the page, 2021: no detectable change. Review schema only, 2021: estimated plus 20%. Article schema, May 2023: no detectable change. Article schema retest, September 2023: no detectable change. Vehicle listing schema, 2025: estimated plus 1.7%, 95% interval minus 1.3% to plus 4.9%, inconclusive. Missing video fields added, 2025: no detectable change. Video section removed from article schema, 2025: estimated minus 9.4% organic sessions. Vendor-reported results; most tests do not publish sample sizes or durations.</desc>

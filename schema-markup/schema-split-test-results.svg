<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d">
<title id="t">Schema split tests: uplifts, losses and null results</title>
<desc id="d">Chart of nine SearchPilot SEO split test results on schema markup, 2020 to 2025, as published by SearchPilot. FAQ schema added, 2020, aggregate of several sites: 67% of tests positive, with uplifts of 4% to 15%. Review and price schema removed so FAQ snippets could show, 2020: minus 5% organic traffic. Review and price schema with reviews shown on the page, 2021: no detectable change. Review schema only, 2021: estimated plus 20%. Article schema, May 2023: no detectable change. Article schema retest, September 2023: no detectable change. Vehicle listing schema, 2025: estimated plus 1.7%, 95% interval minus 1.3% to plus 4.9%, inconclusive. Missing video fields added, 2025: no detectable change. Video section removed from article schema, 2025: estimated minus 9.4% organic sessions. Vendor-reported results; most tests do not publish sample sizes or durations.</desc>
<style>
.bg{fill:#0e192a}
.panel{fill:#111d30;stroke:#26374b;stroke-width:2}
.panel-a{fill:#111d30;stroke:#77e3c4;stroke-width:2.5}
.panel-d{fill:#111d30;stroke:#6f8196;stroke-width:2;stroke-dasharray:8 7}
.title{fill:#ecf2fa;font:700 30px Arial,Helvetica,sans-serif}
.sub{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.h{fill:#77e3c4;font:700 15px Arial,Helvetica,sans-serif;letter-spacing:2px}
.hd{fill:#a9b8c9;font:700 13px Arial,Helvetica,sans-serif;letter-spacing:1.5px}
.t{fill:#ecf2fa;font:600 19px Arial,Helvetica,sans-serif}
.m{fill:#a9b8c9;font:500 16px Arial,Helvetica,sans-serif}
.s{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.a{fill:#77e3c4;font:700 20px Arial,Helvetica,sans-serif}
.v{fill:#ecf2fa;font:700 17px Arial,Helvetica,sans-serif}
.va{fill:#77e3c4;font:700 17px Arial,Helvetica,sans-serif}
.tick{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.note{fill:#a9b8c9;font:500 15px Arial,Helvetica,sans-serif}
.grid{stroke:#26374b;stroke-width:1}
.base{stroke:#6f8196;stroke-width:1.5}
.bar{fill:#77e3c4}
.bar-m{fill:#6f8196}
.dot{fill:#77e3c4}
.ci{stroke:#77e3c4;stroke-width:3}
.ci-m{stroke:#6f8196;stroke-width:3}
.arrow{stroke:#77e3c4;stroke-width:3;fill:none}
.arrow-d{stroke:#6f8196;stroke-width:2.5;fill:none;stroke-dasharray:5 5}
.line{stroke:#26374b;stroke-width:4}
.node{fill:#0e192a;stroke:#77e3c4;stroke-width:3}
.pill{fill:#111d30;stroke:#6f8196;stroke-width:1.5;stroke-dasharray:4 4}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="40" y="50" class="title" text-anchor="start">Schema split tests: uplifts, losses and null results</text>
<text x="40" y="80" class="sub" text-anchor="start">Estimated change in organic traffic in SearchPilot’s published tests, 2020–2025</text>
<line x1="486.7" y1="112" x2="486.7" y2="556" class="grid"/>
<text x="486.7" y="576" class="tick" text-anchor="middle">−10%</text>
<line x1="600.0" y1="112" x2="600.0" y2="556" class="base"/>
<text x="600.0" y="576" class="tick" text-anchor="middle">0%</text>
<line x1="713.3" y1="112" x2="713.3" y2="556" class="grid"/>
<text x="713.3" y="576" class="tick" text-anchor="middle">+10%</text>
<line x1="826.7" y1="112" x2="826.7" y2="556" class="grid"/>
<text x="826.7" y="576" class="tick" text-anchor="middle">+20%</text>
<line x1="940.0" y1="112" x2="940.0" y2="556" class="grid"/>
<text x="940.0" y="576" class="tick" text-anchor="middle">+30%</text>
<text x="40" y="136" class="t" text-anchor="start" style="font-size:16px">FAQ schema added</text>
<text x="40" y="156" class="s" text-anchor="start" style="font-size:13px">2020 · several sites · 67% of tests positive</text>
<rect x="645.3" y="133" width="124.70000000000005" height="18" rx="3" class="bar" style="opacity:.55"/>
<text x="778.0" y="148" class="va" text-anchor="start">+4% to +15%</text>
<text x="40" y="184" class="t" text-anchor="start" style="font-size:16px">Review + price removed for FAQ</text>
<text x="40" y="204" class="s" text-anchor="start" style="font-size:13px">2020 · one site</text>
<rect x="543.3" y="181" width="56.700000000000045" height="18" rx="3" class="bar"/>
<text x="535.3" y="196" class="va" text-anchor="end">−5%</text>
<text x="40" y="232" class="t" text-anchor="start" style="font-size:16px">Review + price schema, reviews shown</text>
<text x="40" y="252" class="s" text-anchor="start" style="font-size:13px">2021 · ecommerce</text>
<rect x="518.0" y="226" width="164" height="24" rx="12" class="pill"/>
<text x="600.0" y="243" class="s" text-anchor="middle" style="font-size:13px">no detectable change</text>
<text x="40" y="280" class="t" text-anchor="start" style="font-size:16px">Review schema only</text>
<text x="40" y="300" class="s" text-anchor="start" style="font-size:13px">2021 · same ecommerce site</text>
<rect x="600.0" y="277" width="226.70000000000005" height="18" rx="3" class="bar"/>
<text x="834.7" y="292" class="va" text-anchor="start">+20%</text>
<text x="40" y="328" class="t" text-anchor="start" style="font-size:16px">Article schema</text>
<text x="40" y="348" class="s" text-anchor="start" style="font-size:13px">May 2023 · service reviews</text>
<rect x="518.0" y="322" width="164" height="24" rx="12" class="pill"/>
<text x="600.0" y="339" class="s" text-anchor="middle" style="font-size:13px">no detectable change</text>
<text x="40" y="376" class="t" text-anchor="start" style="font-size:16px">Article schema, retest</text>
<text x="40" y="396" class="s" text-anchor="start" style="font-size:13px">Sep 2023 · blog articles</text>
<rect x="518.0" y="370" width="164" height="24" rx="12" class="pill"/>
<text x="600.0" y="387" class="s" text-anchor="middle" style="font-size:13px">no detectable change</text>
<text x="40" y="424" class="t" text-anchor="start" style="font-size:16px">Vehicle listing schema</text>
<text x="40" y="444" class="s" text-anchor="start" style="font-size:13px">2025 · vehicle sales · 95% interval</text>
<line x1="585.3" y1="430" x2="655.5" y2="430" class="ci-m"/>
<line x1="585.3" y1="423" x2="585.3" y2="437" class="ci-m"/>
<line x1="655.5" y1="423" x2="655.5" y2="437" class="ci-m"/>
<circle cx="619.3" cy="430" r="6" class="dot"/>
<text x="663.5" y="436" class="va" text-anchor="start" style="font-size:15px">+1.7% (inconclusive)</text>
<text x="40" y="472" class="t" text-anchor="start" style="font-size:16px">Missing video fields added</text>
<text x="40" y="492" class="s" text-anchor="start" style="font-size:13px">2025 · article pages</text>
<rect x="518.0" y="466" width="164" height="24" rx="12" class="pill"/>
<text x="600.0" y="483" class="s" text-anchor="middle" style="font-size:13px">no detectable change</text>
<text x="40" y="520" class="t" text-anchor="start" style="font-size:16px">Video removed from article schema</text>
<text x="40" y="540" class="s" text-anchor="start" style="font-size:13px">2025 · same site</text>
<rect x="493.5" y="517" width="106.5" height="18" rx="3" class="bar"/>
<text x="485.5" y="532" class="va" text-anchor="end">−9.4%</text>
<text x="40" y="616" class="note" text-anchor="start">Vendor-reported. One site per test; most pages give no sample size or duration. Pale bar: range across tests.</text>
</svg>

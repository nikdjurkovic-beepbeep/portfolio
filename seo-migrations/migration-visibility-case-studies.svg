<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 608" width="1000" height="608" role="img" aria-labelledby="t d">
<title id="t">Visibility lost after three documented migrations</title>
<desc id="d">Bar chart of visibility lost after three migrations documented by SISTRIX. The Guardian, 2013, guardian.co.uk to theguardian.com: about 49% lost, from about 550 to about 280 points, back at its previous level in about three months. Lush, 2015 to 2016, lush.co.uk to lush.com: 81% lost, from 8.808 to 1.646 points; most redirects ended in 404 pages. Clarks, 2020, country domains merged into clarks.eu with a platform change at the same time, with redirect chains and hreflang errors: Germany 61% lost, France 92% lost, Spain 97% lost. Measured at different points after each move.</desc>
<style>
.bg{fill:#0e192a}
.panel{fill:#111d30;stroke:#26374b;stroke-width:2}
.panel-a{fill:#111d30;stroke:#77e3c4;stroke-width:2.5}
.title{fill:#ecf2fa;font:700 30px Arial,Helvetica,sans-serif}
.sub{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.h{fill:#77e3c4;font:700 13px Arial,Helvetica,sans-serif;letter-spacing:1.5px}
.t{fill:#ecf2fa;font:700 18px Arial,Helvetica,sans-serif}
.m{fill:#a9b8c9;font:500 15px Arial,Helvetica,sans-serif}
.mw{fill:#d0dbe8;font:500 15px Arial,Helvetica,sans-serif}
.s{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.v{fill:#ecf2fa;font:700 16px Arial,Helvetica,sans-serif}
.va{fill:#77e3c4;font:700 16px Arial,Helvetica,sans-serif}
.vb{fill:#77e3c4;font:700 22px Arial,Helvetica,sans-serif}
.tick{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.note{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.grid{stroke:#26374b;stroke-width:1}
.base{stroke:#6f8196;stroke-width:1.5}
.bar{fill:#77e3c4}
.bar-m{fill:#6f8196}
.line{stroke:#77e3c4;stroke-width:3;fill:none}
.dash{stroke:#a9b8c9;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
.band{fill:#77e3c4;fill-opacity:.12}
.dot{fill:#0e192a;stroke:#77e3c4;stroke-width:2.5}
.arrow{stroke:#77e3c4;stroke-width:2.5;fill:none}
.num{fill:#0e192a;stroke:#77e3c4;stroke-width:2.5}
.numt{fill:#77e3c4;font:700 15px Arial,Helvetica,sans-serif}
.bul{fill:#77e3c4}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="40.0" y="50.0" class="title" text-anchor="start">Visibility lost after three documented migrations</text>
<text x="40.0" y="80.0" class="sub" text-anchor="start">SISTRIX Visibility Index, before the move and at a low point after it</text>
<line x1="330.0" y1="122" x2="330.0" y2="478" class="base"/>
<text x="330.0" y="500.0" class="tick" text-anchor="middle">0%</text>
<line x1="472.5" y1="122" x2="472.5" y2="478" class="grid"/>
<text x="472.5" y="500.0" class="tick" text-anchor="middle">25%</text>
<line x1="615.0" y1="122" x2="615.0" y2="478" class="grid"/>
<text x="615.0" y="500.0" class="tick" text-anchor="middle">50%</text>
<line x1="757.5" y1="122" x2="757.5" y2="478" class="grid"/>
<text x="757.5" y="500.0" class="tick" text-anchor="middle">75%</text>
<line x1="900.0" y1="122" x2="900.0" y2="478" class="grid"/>
<text x="900.0" y="500.0" class="tick" text-anchor="middle">100%</text>
<text x="615.0" y="524.0" class="tick" text-anchor="middle">Share of visibility lost</text>
<text x="40.0" y="152.0" class="v" text-anchor="start">The Guardian, 2013</text>
<text x="40.0" y="172.0" class="s" text-anchor="start">guardian.co.uk → theguardian.com</text>
<rect x="330" y="134" width="279.3" height="30" rx="3" class="bar-m"/>
<text x="619.3" y="155.0" class="va" text-anchor="start">about −49%</text>
<text x="332.0" y="186.0" class="s" text-anchor="start">Back at its previous level in about 3 months</text>
<text x="40.0" y="238.0" class="v" text-anchor="start">Lush, 2015–16</text>
<text x="40.0" y="258.0" class="s" text-anchor="start">lush.co.uk → lush.com</text>
<rect x="330" y="220" width="461.7" height="30" rx="3" class="bar"/>
<text x="801.7" y="241.0" class="va" text-anchor="start">−81%</text>
<text x="332.0" y="272.0" class="s" text-anchor="start">Most redirects ended in 404 pages</text>
<text x="40.0" y="324.0" class="v" text-anchor="start">Clarks Germany, 2020</text>
<text x="40.0" y="344.0" class="s" text-anchor="start">clarks.de → clarks.eu</text>
<rect x="330" y="306" width="347.7" height="30" rx="3" class="bar"/>
<text x="687.7" y="327.0" class="va" text-anchor="start">−61%</text>
<text x="40.0" y="386.0" class="v" text-anchor="start">Clarks France, 2020</text>
<text x="40.0" y="406.0" class="s" text-anchor="start">clarks.fr → clarks.eu</text>
<rect x="330" y="368" width="524.4" height="30" rx="3" class="bar"/>
<text x="864.4" y="389.0" class="va" text-anchor="start">−92%</text>
<text x="40.0" y="448.0" class="v" text-anchor="start">Clarks Spain, 2020</text>
<text x="40.0" y="468.0" class="s" text-anchor="start">clarks.es → clarks.eu</text>
<rect x="330" y="430" width="552.9" height="30" rx="3" class="bar"/>
<text x="892.9" y="451.0" class="va" text-anchor="start">−97%</text>
<path d="M316 304 L308 304 L308 462 L316 462" class="dash"/>
<text x="40.0" y="562.0" class="note" text-anchor="start">Clarks: domains merged and platform changed at once; redirect chains and hreflang errors.</text>
<text x="40.0" y="584.0" class="note" text-anchor="start">Grey bar: the one move that recovered in the source. Lows measured at different points after each move.</text>
</svg>

<text x="210.2" y="417.0" class="va" text-anchor="start">Median</text>
<text x="210.2" y="439.0" class="va" text-anchor="start">304 days</text>
<rect x="120.2" y="489.8" width="146.1" height="24" class="bg"/>
<text x="124.2" y="506.8" class="va" text-anchor="start">22.8% by day 90</text>
<text x="216.7" y="351.6" class="va" text-anchor="end">59.5% by 1 year</text>
<text x="516.0" y="261.9" class="va" text-anchor="end">86.1% by 3 years</text>
<path d="M532 230.0 L540 230.0 L540 275.9 L532 275.9" class="dash"/>
<text x="80.0" y="622.0" class="note" text-anchor="start">13.9% had not recovered after three years.</text>
<text x="80.0" y="646.0" class="note" text-anchor="start">Agency study, partly crowdsourced; monthly</text>
<text x="80.0" y="668.0" class="note" text-anchor="start">data, about ±30 days. Source: SALT.agency, 2026.</text>

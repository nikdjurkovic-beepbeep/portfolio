<text x="30.0" y="50.0" class="title" text-anchor="start">How long domain migrations took</text>
<text x="30.0" y="86.0" class="title" text-anchor="start">to recover</text>
<text x="30.0" y="120.0" class="sub" text-anchor="start">Share of 1,052 domain migrations whose organic traffic was back at its</text>
<text x="30.0" y="143.0" class="sub" text-anchor="start">pre-move baseline</text>
<rect x="92.1" y="230" width="24.1" height="330" class="band"/>
<line x1="80" y1="560.0" x2="520" y2="560.0" class="base"/>
<text x="70.0" y="565.0" class="tick" text-anchor="end">0%</text>

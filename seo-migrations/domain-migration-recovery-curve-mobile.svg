<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720" role="img" aria-labelledby="t d">
<title id="t">How long domain migrations took to recover</title>
<desc id="d">Line chart of cumulative recovery in SALT.agency’s 2026 study of 1,052 domain migrations. Share of migrations whose organic traffic had returned to the pre-move baseline: day 30: 5.1%, day 60: 12.7%, day 90: 22.8%, day 120: 27.8%, day 180: 35.4%, day 270: 43.0%, day 365: 59.5%, day 547: 75.9%, day 730: 83.5%, day 1095: 86.1%. The median recovery time was 304 days. 13.9% had not recovered after three years. A shaded band from day 30 to day 90 marks the typical range Google gave for processing a site move, one to three months, which measures indexing rather than traffic. Agency study, partly crowdsourced; monthly data, about plus or minus 30 days.</desc>
<style>

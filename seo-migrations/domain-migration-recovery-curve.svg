<polyline points="110.0,450.0 131.1,434.2 152.2,410.6 173.3,379.3 194.4,363.8 236.6,340.3 299.9,316.7 366.7,265.6 494.6,214.7 623.3,191.1 880.0,183.1" class="line"/>

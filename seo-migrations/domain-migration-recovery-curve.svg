<circle cx="494.6" cy="214.7" r="4.5" class="dot"/>
<circle cx="623.3" cy="191.1" r="4.5" class="dot"/>
<circle cx="880.0" cy="183.1" r="4.5" class="dot"/>
<text x="333.8" y="321.0" class="va" text-anchor="start">Median: 304 days</text>
<text x="181.3" y="401.3" class="v" text-anchor="start">22.8% by day 90</text>
<text x="356.7" y="253.6" class="v" text-anchor="end">59.5% by 1 year</text>
<text x="876.0" y="169.1" class="v" text-anchor="end">86.1% by 3 years</text>
<path d="M892 140.0 L900 140.0 L900 183.1 L892 183.1" class="dash"/>
<text x="908.0" y="166.7" class="s" text-anchor="start">13.9% not</text>
<text x="908.0" y="184.7" class="s" text-anchor="start">recovered</text>
<text x="110.0" y="512.0" class="note" text-anchor="start">Agency study, partly crowdsourced; monthly data, about ±30 days. Points are the study’s cumulative figures. Source: SALT.agency, 2026.</text>
</svg>

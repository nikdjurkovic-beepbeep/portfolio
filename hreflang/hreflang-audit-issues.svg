<text x="406.0" y="482.0" class="mw" text-anchor="end">More than one page for the same language</text>
<rect x="420" y="464" width="20.0" height="26" rx="4" class="bar"/>
<text x="450.0" y="483.0" class="va" text-anchor="start">2.5%</text>
<text x="406.0" y="526.0" class="mw" text-anchor="end">Same page for more than one language</text>
<rect x="420" y="508" width="20.0" height="26" rx="4" class="bar"/>
<text x="450.0" y="527.0" class="va" text-anchor="start">2.5%</text>
<line x1="420" y1="142" x2="420" y2="546" class="base"/>
<text x="40.0" y="608.0" class="note" text-anchor="start">Vendor study; no methodology published. Grouping by the author, based on Google's documentation and statements.</text>

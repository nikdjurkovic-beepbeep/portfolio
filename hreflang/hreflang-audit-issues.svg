.tick{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.va{fill:#77e3c4;font:700 16px Arial,Helvetica,sans-serif}
.vb{fill:#ecf2fa;font:700 16px Arial,Helvetica,sans-serif}
.vg{fill:#a9b8c9;font:700 16px Arial,Helvetica,sans-serif}
.num{fill:#0e192a;font:700 16px Arial,Helvetica,sans-serif}
.grid{stroke:#26374b;stroke-width:1}
.base{stroke:#6f8196;stroke-width:1.5}
.bar{fill:#77e3c4}
.bar-l{fill:#77e3c4;fill-opacity:.45}
.bar-g{fill:#6f8196}
.dot{fill:#77e3c4}
.line-a{stroke:#77e3c4;stroke-width:2;fill:none}
.arrow{stroke:#6f8196;stroke-width:2;fill:none}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="40.0" y="50.0" class="title" text-anchor="start">Hreflang issues on 374,756 domains: not all are equal</text>
<text x="40.0" y="80.0" class="sub" text-anchor="start">Ahrefs, 2023: 67% of domains using hreflang had at least one issue. Share of domains by issue.</text>
<rect x="40" y="104" width="16" height="14" rx="3" class="bar"/>
<text x="64.0" y="116.0" class="ms" text-anchor="start">Can break or void a pair</text>
<rect x="255.08" y="104" width="16" height="14" rx="3" class="bar-l"/>
<text x="279.1" y="116.0" class="ms" text-anchor="start">Required by Google; Ahrefs calls it best practice</text>
<rect x="623.3200000000002" y="104" width="16" height="14" rx="3" class="bar-g"/>
<text x="647.3" y="116.0" class="ms" text-anchor="start">Optional or not used by Google</text>
<line x1="420.0" y1="142" x2="420.0" y2="546" class="grid"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 632" width="1000" height="632" role="img" aria-labelledby="t d">
<title id="t">Hreflang issues on 374,756 domains: not all are equal</title>
<desc id="d">Horizontal bar chart of hreflang issues found by Ahrefs in 2023 on 374,756 domains that used hreflang, of which 67% had at least one issue. Share of domains with each issue: Pages missing x-default, 56.3%; Pages missing self-referencing tags, 18%; Hreflang pointing to redirected or broken pages, 16.9%; Pages missing reciprocal (return) tags, 15.3%; Hreflang pointing to non-canonical URLs, 8%; Pages with incorrect hreflang values, 4.6%; Pages with inconsistent language attributes, 3.2%; More than one page for the same language, 2.5%; Same page for more than one language, 2.5%. Grouped by the author: missing x-default is optional in Google's documentation and language attributes are not used by Google; self-referencing tags are required by Google's documentation but called best practice by Ahrefs; the other issues can break or void a pair. Vendor study; no methodology published.</desc>
<style>

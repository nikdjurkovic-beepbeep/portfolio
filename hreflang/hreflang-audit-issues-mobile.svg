<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 890" width="600" height="890" role="img" aria-labelledby="t d">
<title id="t">Hreflang issues on 374,756 domains: not all are equal</title>
<desc id="d">Horizontal bar chart of hreflang issues found by Ahrefs in 2023 on 374,756 domains that used hreflang, of which 67% had at least one issue. Share of domains with each issue: Pages missing x-default, 56.3%; Pages missing self-referencing tags, 18%; Hreflang pointing to redirected or broken pages, 16.9%; Pages missing reciprocal (return) tags, 15.3%; Hreflang pointing to non-canonical URLs, 8%; Pages with incorrect hreflang values, 4.6%; Pages with inconsistent language attributes, 3.2%; More than one page for the same language, 2.5%; Same page for more than one language, 2.5%. Grouped by the author: missing x-default is optional in Google's documentation and language attributes are not used by Google; self-referencing tags are required by Google's documentation but called best practice by Ahrefs; the other issues can break or void a pair. Vendor study; no methodology published.</desc>
<style>
.bg{fill:#0e192a}
.panel{fill:#111d30;stroke:#26374b;stroke-width:2}
.panel-a{fill:#111d30;stroke:#77e3c4;stroke-width:2.5}
.title{fill:#ecf2fa;font:700 30px Arial,Helvetica,sans-serif}
.title-m{fill:#ecf2fa;font:700 26px Arial,Helvetica,sans-serif}
.sub{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.h{fill:#77e3c4;font:700 13px Arial,Helvetica,sans-serif;letter-spacing:1.5px}
.t{fill:#ecf2fa;font:700 18px Arial,Helvetica,sans-serif}
.ts{fill:#ecf2fa;font:700 16px Arial,Helvetica,sans-serif}
.m{fill:#a9b8c9;font:500 15px Arial,Helvetica,sans-serif}
.ms{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.mw{fill:#d0dbe8;font:500 15px Arial,Helvetica,sans-serif}
.note{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.tick{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.va{fill:#77e3c4;font:700 16px Arial,Helvetica,sans-serif}
.vb{fill:#ecf2fa;font:700 16px Arial,Helvetica,sans-serif}
.vg{fill:#a9b8c9;font:700 16px Arial,Helvetica,sans-serif}
.num{fill:#0e192a;font:700 16px Arial,Helvetica,sans-serif}
.grid{stroke:#26374b;stroke-width:1}
.base{stroke:#6f8196;stroke-width:1.5}
.bar{fill:#77e3c4}
.bar-l{fill:#77e3c4;fill-opacity:.45}
.bar-g{fill:#6f8196}
.dot{fill:#77e3c4}
.line-a{stroke:#77e3c4;stroke-width:2;fill:none}
.arrow{stroke:#6f8196;stroke-width:2;fill:none}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="28.0" y="46.0" class="title-m" text-anchor="start">Hreflang issues on 374,756 domains: not</text>
<text x="28.0" y="78.0" class="title-m" text-anchor="start">all are equal</text>
<text x="28.0" y="110.0" class="sub" text-anchor="start">Ahrefs, 2023: 67% of domains using hreflang had at least one issue.</text>
<text x="28.0" y="132.0" class="sub" text-anchor="start">Share of domains by issue.</text>
<rect x="28" y="160" width="16" height="14" rx="3" class="bar"/>
<text x="52.0" y="172.0" class="ms" text-anchor="start">Can break or void a pair</text>
<rect x="28" y="184" width="16" height="14" rx="3" class="bar-l"/>
<text x="52.0" y="196.0" class="ms" text-anchor="start">Required by Google; Ahrefs calls it best practice</text>
<rect x="28" y="208" width="16" height="14" rx="3" class="bar-g"/>
<text x="52.0" y="220.0" class="ms" text-anchor="start">Optional or not used by Google</text>
<text x="28.0" y="258.0" class="mw" text-anchor="start">Pages missing x-default</text>
<rect x="28" y="268" width="414.7" height="24" rx="4" class="bar-g"/>
<text x="452.7" y="286.0" class="vg" text-anchor="start">56.3%</text>
<text x="28.0" y="322.0" class="mw" text-anchor="start">Pages missing self-referencing tags</text>
<rect x="28" y="332" width="132.6" height="24" rx="4" class="bar-l"/>
<text x="170.6" y="350.0" class="vb" text-anchor="start">18%</text>
<text x="28.0" y="386.0" class="mw" text-anchor="start">Hreflang pointing to redirected or broken pages</text>
<rect x="28" y="396" width="124.5" height="24" rx="4" class="bar"/>
<text x="162.5" y="414.0" class="va" text-anchor="start">16.9%</text>
<text x="28.0" y="450.0" class="mw" text-anchor="start">Pages missing reciprocal (return) tags</text>
<rect x="28" y="460" width="112.7" height="24" rx="4" class="bar"/>
<text x="150.7" y="478.0" class="va" text-anchor="start">15.3%</text>
<text x="28.0" y="514.0" class="mw" text-anchor="start">Hreflang pointing to non-canonical URLs</text>
<rect x="28" y="524" width="58.9" height="24" rx="4" class="bar"/>
<text x="96.9" y="542.0" class="va" text-anchor="start">8%</text>
<text x="28.0" y="578.0" class="mw" text-anchor="start">Pages with incorrect hreflang values</text>
<rect x="28" y="588" width="33.9" height="24" rx="4" class="bar"/>
<text x="71.9" y="606.0" class="va" text-anchor="start">4.6%</text>
<text x="28.0" y="642.0" class="mw" text-anchor="start">Pages with inconsistent language attributes</text>
<rect x="28" y="652" width="23.6" height="24" rx="4" class="bar-g"/>
<text x="61.6" y="670.0" class="vg" text-anchor="start">3.2%</text>
<text x="28.0" y="706.0" class="mw" text-anchor="start">More than one page for the same language</text>
<rect x="28" y="716" width="18.4" height="24" rx="4" class="bar"/>
<text x="56.4" y="734.0" class="va" text-anchor="start">2.5%</text>
<text x="28.0" y="770.0" class="mw" text-anchor="start">Same page for more than one language</text>
<rect x="28" y="780" width="18.4" height="24" rx="4" class="bar"/>
<text x="56.4" y="798.0" class="va" text-anchor="start">2.5%</text>
<text x="24.0" y="842.0" class="note" text-anchor="start">Vendor study; no methodology published. Grouping by the author, based on Google's</text>
<text x="24.0" y="861.0" class="note" text-anchor="start">documentation and statements.</text>
</svg>

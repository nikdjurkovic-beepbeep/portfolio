<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 776" width="600" height="776" role="img" aria-labelledby="t d">
<title id="t">How long Google took to render pages after crawling them</title>
<desc id="d">Horizontal bar chart on a logarithmic time scale. Delay between Googlebot’s crawl and the completed render on nextjs.org in April 2024, from more than 37,000 matched crawl and render events measured by Vercel and MERJ: 25th percentile within 4 seconds; median 10 seconds; 75th percentile 26 seconds; 90th percentile about 3 hours; 95th percentile about 6 hours; 99th percentile about 18 hours.</desc>
<style>
.bg{fill:#0e192a}
.panel{fill:#111d30;stroke:#26374b;stroke-width:2}
.panel-a{fill:#111d30;stroke:#77e3c4;stroke-width:2.5}
.panel-d{fill:#111d30;stroke:#6f8196;stroke-width:2;stroke-dasharray:8 7}
.title{fill:#ecf2fa;font:700 30px Arial,Helvetica,sans-serif}
.sub{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.h{fill:#77e3c4;font:700 16px Arial,Helvetica,sans-serif;letter-spacing:2px}
.t{fill:#ecf2fa;font:600 20px Arial,Helvetica,sans-serif}
.m{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.a{fill:#77e3c4;font:700 21px Arial,Helvetica,sans-serif}
.v{fill:#ecf2fa;font:700 18px Arial,Helvetica,sans-serif}
.tick{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.note{fill:#a9b8c9;font:500 15px Arial,Helvetica,sans-serif}
.grid{stroke:#26374b;stroke-width:1}
.base{stroke:#6f8196;stroke-width:1.5}
.bar{fill:#77e3c4}
.arrow{stroke:#77e3c4;stroke-width:3;fill:none}
.arrow-d{stroke:#6f8196;stroke-width:3;fill:none;stroke-dasharray:6 6}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="24" y="44" class="title" text-anchor="start" style="font-size:27px">How long Google took to</text>
<text x="24" y="78" class="title" text-anchor="start" style="font-size:27px">render pages after crawling</text>
<text x="24" y="108" class="sub" text-anchor="start">nextjs.org, April 2024 · 37,000+ matched</text>
<text x="24" y="130" class="sub" text-anchor="start">events · Vercel and MERJ</text>
<line x1="24.0" y1="156" x2="24.0" y2="676" class="base"/>
<text x="24.0" y="696" class="tick" text-anchor="start">1 s</text>
<line x1="209.9" y1="156" x2="209.9" y2="676" class="grid"/>
<text x="209.9" y="696" class="tick" text-anchor="middle">1 min</text>
<line x1="395.7" y1="156" x2="395.7" y2="676" class="grid"/>
<text x="395.7" y="696" class="tick" text-anchor="middle">1 h</text>
<line x1="540.0" y1="156" x2="540.0" y2="676" class="grid"/>
<text x="540.0" y="696" class="tick" text-anchor="end">1 day</text>
<text x="24" y="178" class="t" text-anchor="start" style="font-size:18px">25th percentile</text>
<path d="M24 192 H82.9 Q86.9 192 86.9 196 V216 Q86.9 220 82.9 220 H24 Z" class="bar"/>
<text x="96.9" y="212" class="v" text-anchor="start">within 4 s</text>
<text x="24" y="264" class="t" text-anchor="start" style="font-size:18px">Median</text>
<path d="M24 278 H124.5 Q128.5 278 128.5 282 V302 Q128.5 306 124.5 306 H24 Z" class="bar"/>
<text x="138.5" y="298" class="v" text-anchor="start">10 s</text>
<text x="24" y="350" class="t" text-anchor="start" style="font-size:18px">75th percentile</text>
<path d="M24 364 H167.9 Q171.9 364 171.9 368 V388 Q171.9 392 167.9 392 H24 Z" class="bar"/>
<text x="181.9" y="384" class="v" text-anchor="start">26 s</text>
<text x="24" y="436" class="t" text-anchor="start" style="font-size:18px">90th percentile</text>
<path d="M24 450 H441.6 Q445.6 450 445.6 454 V474 Q445.6 478 441.6 478 H24 Z" class="bar"/>
<text x="455.6" y="470" class="v" text-anchor="start">~3 h</text>
<text x="24" y="522" class="t" text-anchor="start" style="font-size:18px">95th percentile</text>
<path d="M24 536 H473.1 Q477.1 536 477.1 540 V560 Q477.1 564 473.1 564 H24 Z" class="bar"/>
<text x="487.1" y="556" class="v" text-anchor="start">~6 h</text>
<text x="24" y="608" class="t" text-anchor="start" style="font-size:18px">99th percentile</text>
<path d="M24 622 H522.9 Q526.9 622 526.9 626 V646 Q526.9 650 522.9 650 H24 Z" class="bar"/>
<text x="516.9" y="642" class="v" text-anchor="end" style="fill:#0b1220">~18 h</text>
<text x="24" y="730" class="note" text-anchor="start">Logarithmic scale. Median 10 seconds;</text>
<text x="24" y="752" class="note" text-anchor="start">the slowest 10% took hours.</text>
</svg>

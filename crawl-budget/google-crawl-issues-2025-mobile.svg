<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" role="img" aria-labelledby="t d">
<title id="t">What caused Google’s crawling issues in 2025</title>
<desc id="d">Horizontal bar chart. Approximate share of crawling issues in Google’s internal year-end report for 2025: faceted navigation about 50%; action parameters such as add to cart and wishlist about 25%; irrelevant parameters such as tracking and session IDs about 10%; plugins and widgets about 5%; other rare issues such as double-encoded URLs about 2%. The remaining share, about 8%, was not broken down. Source: Search Off the Record, February 2026, as reported by Search Engine Roundtable and Search Engine Journal.</desc>
<style>
.bg{fill:#0e192a}
.panel{fill:#111d30;stroke:#26374b;stroke-width:2}
.panel-a{fill:#111d30;stroke:#77e3c4;stroke-width:2.5}
.panel-d{fill:#111d30;stroke:#6f8196;stroke-width:2;stroke-dasharray:8 7}
.title{fill:#ecf2fa;font:700 30px Arial,Helvetica,sans-serif}
.sub{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.h{fill:#77e3c4;font:700 16px Arial,Helvetica,sans-serif;letter-spacing:2px}
.t{fill:#ecf2fa;font:600 20px Arial,Helvetica,sans-serif}
.m{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.a{fill:#77e3c4;font:700 21px Arial,Helvetica,sans-serif}
.v{fill:#ecf2fa;font:700 18px Arial,Helvetica,sans-serif}
.tick{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.note{fill:#a9b8c9;font:500 15px Arial,Helvetica,sans-serif}
.grid{stroke:#26374b;stroke-width:1}
.base{stroke:#6f8196;stroke-width:1.5}
.bar{fill:#77e3c4}
.arrow{stroke:#77e3c4;stroke-width:3;fill:none}
.arrow-d{stroke:#6f8196;stroke-width:3;fill:none;stroke-dasharray:6 6}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="24" y="44" class="title" text-anchor="start" style="font-size:27px">What caused Google’s</text>
<text x="24" y="78" class="title" text-anchor="start" style="font-size:27px">crawling issues in 2025</text>
<text x="24" y="108" class="sub" text-anchor="start">Approximate share of issues in Google’s</text>
<text x="24" y="130" class="sub" text-anchor="start">internal year-end crawl report</text>
<text x="24" y="180" class="t" text-anchor="start" style="font-size:19px">Faceted navigation</text>
<text x="24" y="202" class="m" text-anchor="start" style="font-size:15px">filters and sort orders</text>
<line x1="24" y1="214" x2="24" y2="246" class="base"/>
<path d="M24 216 H496.0 Q500.0 216 500.0 220 V240 Q500.0 244 496.0 244 H24 Z" class="bar"/>
<text x="510.0" y="237" class="v" text-anchor="start">~50%</text>
<text x="24" y="284" class="t" text-anchor="start" style="font-size:19px">Action parameters</text>
<text x="24" y="306" class="m" text-anchor="start" style="font-size:15px">add to cart, add to wishlist</text>
<line x1="24" y1="318" x2="24" y2="350" class="base"/>
<path d="M24 320 H258.0 Q262.0 320 262.0 324 V344 Q262.0 348 258.0 348 H24 Z" class="bar"/>
<text x="272.0" y="341" class="v" text-anchor="start">~25%</text>
<text x="24" y="388" class="t" text-anchor="start" style="font-size:19px">Irrelevant parameters</text>
<text x="24" y="410" class="m" text-anchor="start" style="font-size:15px">tracking, session IDs</text>
<line x1="24" y1="422" x2="24" y2="454" class="base"/>
<path d="M24 424 H115.2 Q119.2 424 119.2 428 V448 Q119.2 452 115.2 452 H24 Z" class="bar"/>
<text x="129.2" y="445" class="v" text-anchor="start">~10%</text>
<text x="24" y="492" class="t" text-anchor="start" style="font-size:19px">Plugins and widgets</text>
<text x="24" y="514" class="m" text-anchor="start" style="font-size:15px">e.g. WordPress plugins</text>
<line x1="24" y1="526" x2="24" y2="558" class="base"/>
<path d="M24 528 H67.6 Q71.6 528 71.6 532 V552 Q71.6 556 67.6 556 H24 Z" class="bar"/>
<text x="81.6" y="549" class="v" text-anchor="start">~5%</text>
<text x="24" y="596" class="t" text-anchor="start" style="font-size:19px">Other rare issues</text>
<text x="24" y="618" class="m" text-anchor="start" style="font-size:15px">e.g. double-encoded URLs</text>
<line x1="24" y1="630" x2="24" y2="662" class="base"/>
<path d="M24 632 H39.0 Q43.0 632 43.0 636 V656 Q43.0 660 39.0 660 H24 Z" class="bar"/>
<text x="53.0" y="653" class="v" text-anchor="start">~2%</text>
<text x="24" y="690" class="note" text-anchor="start">About 8% not broken down.</text>
<text x="24" y="714" class="note" text-anchor="start">Search Off the Record, February 2026, via</text>
<text x="24" y="736" class="note" text-anchor="start">Search Engine Roundtable and Search Engine Journal.</text>
</svg>

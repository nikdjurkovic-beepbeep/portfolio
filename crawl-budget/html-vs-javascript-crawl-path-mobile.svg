<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 972" width="600" height="972" role="img" aria-labelledby="t d">
<title id="t">What Google fetches for one page</title>
<desc id="d">Two rows. Server-rendered HTML: one HTML response containing content and links goes straight to indexing and link discovery, one fetch per page. Client-side rendered: an HTML shell, then JavaScript and CSS bundles that are shared across pages and cached by Google for up to 30 days, then API or XHR calls with a new URL for every page, so the cache does not help, then a render queue lasting seconds to hours, then indexing and links found after rendering. Each fetch counts toward the crawl budget of the hostname that serves it and has its own 2MB limit. The rendering service does not fetch images or video.</desc>
<style>
.bg{fill:#0e192a}
.panel{fill:#111d30;stroke:#26374b;stroke-width:2}
.panel-a{fill:#111d30;stroke:#77e3c4;stroke-width:2.5}
.panel-d{fill:#111d30;stroke:#6f8196;stroke-width:2;stroke-dasharray:8 7}
.title{fill:#ecf2fa;font:700 30px Arial,Helvetica,sans-serif}
.sub{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.h{fill:#77e3c4;font:700 16px Arial,Helvetica,sans-serif;letter-spacing:2px}
.t{fill:#ecf2fa;font:600 20px Arial,Helvetica,sans-serif}
.m{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.a{fill:#77e3c4;font:700 21px Arial,Helvetica,sans-serif}
.v{fill:#ecf2fa;font:700 18px Arial,Helvetica,sans-serif}
.tick{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.note{fill:#a9b8c9;font:500 15px Arial,Helvetica,sans-serif}
.grid{stroke:#26374b;stroke-width:1}
.base{stroke:#6f8196;stroke-width:1.5}
.bar{fill:#77e3c4}
.arrow{stroke:#77e3c4;stroke-width:3;fill:none}
.arrow-d{stroke:#6f8196;stroke-width:3;fill:none;stroke-dasharray:6 6}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="300" y="44" class="title" text-anchor="middle" style="font-size:27px">What Google fetches for one page</text>
<text x="24" y="92" class="h" text-anchor="start">SERVER-RENDERED HTML</text>
<rect x="24" y="106" width="552" height="70" rx="12" class="panel"/>
<text x="48" y="136" class="t" text-anchor="start">HTML response</text>
<text x="48" y="160" class="m" text-anchor="start">content and links in one fetch</text>
<path d="M300 178 V204" class="arrow"/><path d="M292 196 L300 206 L308 196" class="arrow" style="stroke-dasharray:none"/>
<rect x="24" y="208" width="552" height="62" rx="12" class="panel"/>
<text x="48" y="236" class="t" text-anchor="start">Indexing</text>
<text x="48" y="258" class="m" text-anchor="start">links found at once</text>
<text x="24" y="318" class="h" text-anchor="start">CLIENT-SIDE RENDERED</text>
<rect x="24" y="332" width="552" height="62" rx="12" class="panel"/>
<text x="48" y="360" class="t" text-anchor="start">HTML shell</text>
<text x="48" y="382" class="m" text-anchor="start">little content</text>
<path d="M300 396 V420" class="arrow"/><path d="M292 412 L300 422 L308 412" class="arrow" style="stroke-dasharray:none"/>
<rect x="24" y="424" width="552" height="62" rx="12" class="panel-d"/>
<text x="48" y="452" class="t" text-anchor="start">JS and CSS bundles</text>
<text x="48" y="474" class="m" text-anchor="start">shared, cached up to 30 days</text>
<path d="M300 488 V512" class="arrow"/><path d="M292 504 L300 514 L308 504" class="arrow" style="stroke-dasharray:none"/>
<rect x="24" y="516" width="552" height="62" rx="12" class="panel-a"/>
<text x="48" y="544" class="t" text-anchor="start">API / XHR calls</text>
<text x="48" y="566" class="m" text-anchor="start">a new URL for every page</text>
<path d="M300 580 V604" class="arrow"/><path d="M292 596 L300 606 L308 596" class="arrow" style="stroke-dasharray:none"/>
<rect x="24" y="608" width="552" height="62" rx="12" class="panel"/>
<text x="48" y="636" class="t" text-anchor="start">Render queue</text>
<text x="48" y="658" class="m" text-anchor="start">seconds to hours</text>
<path d="M300 672 V696" class="arrow"/><path d="M292 688 L300 698 L308 688" class="arrow" style="stroke-dasharray:none"/>
<rect x="24" y="700" width="552" height="62" rx="12" class="panel"/>
<text x="48" y="728" class="t" text-anchor="start">Indexing</text>
<text x="48" y="750" class="m" text-anchor="start">links found after render</text>
<rect x="24" y="778" width="22" height="16" rx="4" class="panel-d"/>
<text x="56" y="792" class="note" text-anchor="start">Fetched once, reused across pages</text>
<rect x="24" y="806" width="22" height="16" rx="4" class="panel-a"/>
<text x="56" y="820" class="note" text-anchor="start">Cost grows with the number of pages</text>
<rect x="24" y="844" width="552" height="104" rx="10" class="panel"/>
<text x="300" y="876" class="note" text-anchor="middle" style="fill:#ecf2fa">Each fetch counts toward the crawl budget</text>
<text x="300" y="900" class="note" text-anchor="middle">of the hostname that serves it and has its own</text>
<text x="300" y="924" class="note" text-anchor="middle">2MB limit. No image or video fetches.</text>
</svg>

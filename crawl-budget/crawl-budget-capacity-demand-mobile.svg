<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 890" width="600" height="890" role="img" aria-labelledby="t d">
<title id="t">How crawl budget is set</title>
<desc id="d">Two limits set crawl budget for each hostname. The crawl capacity limit is what the server can handle: crawl health, meaning fast, stable responses raise it while slowdowns, 5xx errors and 429 responses lower it, and Google’s own finite resources. Crawl demand is what Google wants to crawl: perceived inventory, the URLs Google knows about; popularity, as popular URLs are recrawled more often; and staleness, as Google recrawls to pick up changes. Together they define crawl budget: the URLs Google can and wants to crawl on one hostname. Every fetch counts: HTML pages, redirects, alternate URLs, CSS, JavaScript and XHR or API calls. Crawl budget is not a ranking signal.</desc>
<style>
.bg{fill:#0e192a}
.panel{fill:#111d30;stroke:#26374b;stroke-width:2}
.panel-a{fill:#111d30;stroke:#77e3c4;stroke-width:2.5}
.panel-d{fill:#111d30;stroke:#6f8196;stroke-width:2;stroke-dasharray:8 7}
.title{fill:#ecf2fa;font:700 30px Arial,Helvetica,sans-serif}
.sub{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.h{fill:#77e3c4;font:700 16px Arial,Helvetica,sans-serif;letter-spacing:2px}
.t{fill:#ecf2fa;font:600 20px Arial,Helvetica,sans-serif}
.m{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.a{fill:#77e3c4;font:700 21px Arial,Helvetica,sans-serif}
.v{fill:#ecf2fa;font:700 18px Arial,Helvetica,sans-serif}
.tick{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.note{fill:#a9b8c9;font:500 15px Arial,Helvetica,sans-serif}
.grid{stroke:#26374b;stroke-width:1}
.base{stroke:#6f8196;stroke-width:1.5}
.bar{fill:#77e3c4}
.arrow{stroke:#77e3c4;stroke-width:3;fill:none}
.arrow-d{stroke:#6f8196;stroke-width:3;fill:none;stroke-dasharray:6 6}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="300" y="46" class="title" text-anchor="middle" style="font-size:28px">How crawl budget is set</text>
<rect x="24" y="76" width="552" height="244" rx="12" class="panel"/>
<text x="48" y="110" class="h" text-anchor="start">CRAWL CAPACITY LIMIT</text>
<text x="48" y="136" class="m" text-anchor="start">What the server can handle</text>
<text x="48" y="180" class="t" text-anchor="start">Crawl health</text>
<text x="48" y="205" class="m" text-anchor="start">Fast, stable responses raise it.</text>
<text x="48" y="228" class="m" text-anchor="start">Slowdowns, 5xx and 429 lower it.</text>
<text x="48" y="270" class="t" text-anchor="start">Google’s own resources</text>
<text x="48" y="295" class="m" text-anchor="start">Finite, shared across the web</text>
<rect x="24" y="340" width="552" height="274" rx="12" class="panel"/>
<text x="48" y="374" class="h" text-anchor="start">CRAWL DEMAND</text>
<text x="48" y="400" class="m" text-anchor="start">What Google wants to crawl</text>
<text x="48" y="444" class="t" text-anchor="start">Perceived inventory</text>
<text x="48" y="469" class="m" text-anchor="start">Every URL Google knows about</text>
<text x="48" y="510" class="t" text-anchor="start">Popularity</text>
<text x="48" y="535" class="m" text-anchor="start">Popular URLs are recrawled more often</text>
<text x="48" y="576" class="t" text-anchor="start">Staleness</text>
<text x="48" y="601" class="m" text-anchor="start">Google recrawls to pick up changes</text>
<path d="M300 618 V660" class="arrow"/><path d="M292 652 L300 662 L308 652" class="arrow" style="stroke-dasharray:none"/>
<rect x="24" y="666" width="552" height="84" rx="12" class="panel-a"/>
<text x="300" y="700" class="a" text-anchor="middle">Crawl budget, per hostname</text>
<text x="300" y="728" class="m" text-anchor="middle">The URLs Google can and wants to crawl</text>
<rect x="24" y="772" width="552" height="92" rx="10" class="panel-d"/>
<text x="300" y="806" class="note" text-anchor="middle">Every fetch counts: HTML pages, redirects,</text>
<text x="300" y="832" class="note" text-anchor="middle">alternate URLs, CSS, JavaScript, XHR and API calls</text>
</svg>

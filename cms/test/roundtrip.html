<!doctype html><html><head><meta charset="utf-8"></head><body><textarea id="ed"></textarea>
<script src="/admin/vendor/tinymce/tinymce.min.js"></script>
<script type="module">
import { editorConfig } from '/admin/js/editor-config.js';
window.ready = new Promise(res => tinymce.init(editorConfig({ target: document.getElementById('ed'), setup: ed => ed.on('init', () => res(ed)) })));
window.roundtrip = async html => { const ed = await window.ready; ed.setContent(html); return ed.getContent(); };
</script></body></html>

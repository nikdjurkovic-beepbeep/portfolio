<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 771" width="600" height="771" role="img" aria-labelledby="t d">
<title id="t">robots.txt and noindex are not interchangeable</title>
<desc id="d">Two-by-two grid of robots.txt and noindex combinations. Crawling allowed and no noindex on the page: Crawled and evaluated. Indexed only if Google selects it. Duplicates fold into one canonical. Crawling allowed and noindex on the page: Crawled, noindex seen. Dropped from Google Search results once Googlebot reads the tag. Blocked in robots.txt and no noindex on the page: Not crawled. The URL can still be indexed if other pages link to it, shown without a description. Blocked in robots.txt and noindex on the page: Not crawled, noindex never seen. The block hides the tag. The URL can still appear in results if other pages link to it. The last combination is highlighted as the common mistake. To keep a page out of Google, it has to be crawlable so the noindex can be read.</desc>
<style>
.bg{fill:#0e192a}
.panel{fill:#111d30;stroke:#26374b;stroke-width:2}
.panel-a{fill:#111d30;stroke:#77e3c4;stroke-width:2.5}
.title{fill:#ecf2fa;font:700 30px Arial,Helvetica,sans-serif}
.sub{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.h{fill:#77e3c4;font:700 13px Arial,Helvetica,sans-serif;letter-spacing:1.5px}
.t{fill:#ecf2fa;font:700 18px Arial,Helvetica,sans-serif}
.m{fill:#a9b8c9;font:500 15px Arial,Helvetica,sans-serif}
.mw{fill:#d0dbe8;font:500 15px Arial,Helvetica,sans-serif}
.st{fill:#77e3c4;font:600 14px Arial,Helvetica,sans-serif}
.note{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.tick{fill:#a9b8c9;font:500 14px Arial,Helvetica,sans-serif}
.va{fill:#77e3c4;font:700 18px Arial,Helvetica,sans-serif}
.grid{stroke:#26374b;stroke-width:1}
.base{stroke:#6f8196;stroke-width:1.5}
.bar{fill:#77e3c4}
.band{fill:#77e3c4;fill-opacity:.35}
.num{fill:#0e192a;stroke:#77e3c4;stroke-width:2.5}
.numt{fill:#77e3c4;font:700 15px Arial,Helvetica,sans-serif}
.bul{fill:#77e3c4}
.brk{stroke:#77e3c4;stroke-width:2.5;fill:none}
.arrow{stroke:#6f8196;stroke-width:2;fill:none}
.arrowh{fill:#6f8196}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="30.0" y="50.0" class="title" text-anchor="start">robots.txt and noindex are not</text>
<text x="30.0" y="86.0" class="title" text-anchor="start">interchangeable</text>
<text x="30.0" y="122.0" class="sub" text-anchor="start">What Google can do with a URL under each combination of the two</text>
<text x="30.0" y="146.0" class="sub" text-anchor="start">controls.</text>
<rect x="30" y="184" width="540" height="104" rx="12" class="panel"/>
<text x="50.0" y="214.0" class="h" text-anchor="start">CRAWLING ALLOWED · NO NOINDEX</text>
<text x="50" y="244" class="t" style="font-size:20px">Crawled and evaluated</text>
<text x="50" y="274" class="mw" style="font-size:16px">Indexed only if Google selects it. Duplicates fold into one canonical.</text>
<rect x="30" y="302" width="540" height="104" rx="12" class="panel"/>
<text x="50.0" y="332.0" class="h" text-anchor="start">CRAWLING ALLOWED · NOINDEX</text>
<text x="50" y="362" class="t" style="font-size:20px">Crawled, noindex seen</text>
<text x="50" y="392" class="mw" style="font-size:16px">Dropped from Google Search results once Googlebot reads the tag.</text>
<rect x="30" y="420" width="540" height="126" rx="12" class="panel"/>
<text x="50.0" y="450.0" class="h" text-anchor="start">BLOCKED IN ROBOTS.TXT · NO NOINDEX</text>
<text x="50" y="480" class="t" style="font-size:20px">Not crawled</text>
<text x="50" y="510" class="mw" style="font-size:16px">The URL can still be indexed if other pages link to it, shown without a</text>
<text x="50" y="532" class="mw" style="font-size:16px">description.</text>
<rect x="30" y="560" width="540" height="150" rx="12" class="panel-a"/>
<text x="50.0" y="590.0" class="h" text-anchor="start">BLOCKED IN ROBOTS.TXT · NOINDEX</text>
<text x="50.0" y="616.0" class="h" text-anchor="start">COMMON MISTAKE</text>
<text x="50" y="644" class="t" style="font-size:20px">Not crawled, noindex never seen</text>
<text x="50" y="674" class="mw" style="font-size:16px">The block hides the tag. The URL can still appear in results if other</text>
<text x="50" y="696" class="mw" style="font-size:16px">pages link to it.</text>
<text x="30" y="738" class="note" style="font-size:15px">To keep a page out of Google, it has to be crawlable so the noindex can be read.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 758" width="1000" height="758" role="img" aria-labelledby="t d">
<title id="t">Crawled is not the same as indexed</title>
<desc id="d">Diagram of the five stages a URL passes through in Google Search, with the controls and Search Console statuses at each stage. Stages 1 and 2 are labelled crawlability; stage 4 is labelled indexability and index selection. Stage 1, Discovery: Google learns the URL exists. Controlled by Internal and external links, XML sitemaps, Redirects from known URLs. Search Console statuses: Discovered – currently not indexed. Stage 2, Crawling: Googlebot fetches the URL. Controlled by robots.txt rules, Server status and speed (5xx, 429), Crawl demand and capacity. Search Console statuses: URL blocked by robots.txt, Server error (5xx), Redirect error. Stage 3, Rendering: Google runs the page’s JavaScript. Controlled by Scripts and resources Google can fetch, Content present in the rendered HTML. Search Console statuses: No separate status; URL Inspection shows the rendered page. Stage 4, Indexing: Google decides whether to store the page. Controlled by noindex (meta tag or HTTP header), Canonical clustering of duplicates, Soft 404 detection, Index selection: quality and signals. Search Console statuses: URL marked ‘noindex’, Duplicate … canonical statuses, Soft 404, Crawled – currently not indexed. Stage 5, Serving: Indexed pages compete for queries. Controlled by Relevance and ranking systems. Search Console statuses: Indexed. robots.txt acts on crawling. noindex, canonicals and quality act on indexing. Google: “Indexing isn’t guaranteed; not every page that Google processes will be indexed.”</desc>
<style>

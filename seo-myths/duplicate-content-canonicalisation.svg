<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
<title id="t">Duplicate URLs are clustered, not penalised</title>
<desc id="d">Four URL variants of the same page: http://example.com/shoes/, https://example.com/shoes/, https://example.com/shoes/?ref=email, https://example.com/shoes/?sort=price. Google groups them into a duplicate cluster and selects one canonical URL, https://example.com/shoes/, to show in search results. The other variants are filtered from results, not penalised. Redirects, rel=canonical, sitemaps and HTTPS inform the choice. Action is reserved for duplication meant to deceive, such as scraped content.</desc>
<style>
.bg{fill:#0e192a}
.panel{fill:#111d30;stroke:#26374b;stroke-width:2}
.panel-a{fill:#111d30;stroke:#77e3c4;stroke-width:2.5}
.panel-d{fill:#111d30;stroke:#6f8196;stroke-width:2;stroke-dasharray:8 7}
.title{fill:#ecf2fa;font:700 30px Arial,Helvetica,sans-serif}
.h{fill:#77e3c4;font:700 17px Arial,Helvetica,sans-serif;letter-spacing:2px}
.t{fill:#ecf2fa;font:600 21px Arial,Helvetica,sans-serif}
.m{fill:#a9b8c9;font:500 19px Arial,Helvetica,sans-serif}
.a{fill:#77e3c4;font:700 21px Arial,Helvetica,sans-serif}
.code{fill:#ecf2fa;font:500 17px 'Courier New',Courier,monospace}
.note{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.arrow{stroke:#77e3c4;stroke-width:3;fill:none}
.arrow-d{stroke:#6f8196;stroke-width:3;fill:none;stroke-dasharray:6 6}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="500.0" y="52" class="title" text-anchor="middle">Duplicate URLs are clustered, not penalised</text>
<text x="210" y="100" class="h" text-anchor="middle">URL VARIANTS</text>
<rect x="20" y="120" width="380" height="52" rx="12" class="panel"/>
<text x="210" y="152" class="code" text-anchor="middle" style="font-size:16px">http://example.com/shoes/</text>
<path d="M400 146 C440 146 440 251 470 251" class="arrow"/>
<rect x="20" y="190" width="380" height="52" rx="12" class="panel"/>
<text x="210" y="222" class="code" text-anchor="middle" style="font-size:16px">https://example.com/shoes/</text>
<path d="M400 216 C440 216 440 251 470 251" class="arrow"/>
<rect x="20" y="260" width="380" height="52" rx="12" class="panel"/>
<text x="210" y="292" class="code" text-anchor="middle" style="font-size:16px">https://example.com/shoes/?ref=email</text>
<path d="M400 286 C440 286 440 251 470 251" class="arrow"/>
<rect x="20" y="330" width="380" height="52" rx="12" class="panel"/>
<text x="210" y="362" class="code" text-anchor="middle" style="font-size:16px">https://example.com/shoes/?sort=price</text>
<path d="M400 356 C440 356 440 251 470 251" class="arrow"/>
<path d="M461 243 L470 251 L461 259" class="arrow"/>
<rect x="472" y="196" width="170" height="110" rx="12" class="panel"/>
<text x="557" y="243" class="t" text-anchor="middle">Duplicate</text>
<text x="557" y="271" class="t" text-anchor="middle">cluster</text>
<path d="M642 236 C680 236 680 170 712 170" class="arrow"/>
<path d="M703 162 L712 170 L703 178" class="arrow"/>
<path d="M642 272 C680 272 680 338 712 338" class="arrow-d"/>
<rect x="714" y="118" width="266" height="106" rx="12" class="panel-a"/>
<text x="847" y="152" class="h" text-anchor="middle">CANONICAL</text>
<text x="847" y="182" class="a" text-anchor="middle" style="font-size:21px">/shoes/ (HTTPS)</text>
<text x="847" y="208" class="m" text-anchor="middle" style="font-size:18px">Shown in results</text>
<rect x="714" y="286" width="266" height="106" rx="12" class="panel-d"/>
<text x="847" y="320" class="h" text-anchor="middle">OTHER VARIANTS</text>
<text x="847" y="350" class="t" text-anchor="middle" style="font-size:20px">Filtered from results</text>
<text x="847" y="376" class="m" text-anchor="middle" style="font-size:18px">Not penalised</text>
<rect x="20" y="420" width="960" height="112" rx="12" class="panel"/>
<text x="45" y="458" class="m" text-anchor="start" style="font-size:19px">Signals that inform the choice:</text>
<text x="330" y="458" class="t" text-anchor="start" style="font-size:19px">redirects · rel=canonical · sitemaps · HTTPS</text>
<text x="45" y="500" class="m" text-anchor="start" style="font-size:19px">When action is taken:</text>
<text x="330" y="500" class="t" text-anchor="start" style="font-size:19px">duplication meant to deceive, e.g. scraped content</text>
</svg>

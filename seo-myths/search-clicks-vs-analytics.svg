<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" role="img" aria-labelledby="t d">
<title id="t">Two sources of click data</title>
<desc id="d">Left panel, Google's results pages: searchers click results; clicks are aggregated by query and document; Navboost uses 13 months of click-and-query data; this feeds ranking. Documented in the 2024 US v. Google ruling. Right panel, your website: visitors land on a page; an analytics tag records the session; bounce rate and engagement rate appear in your reports. Google says it does not use Google Analytics data for ranking.</desc>
<style>
.bg{fill:#0e192a}
.panel{fill:#111d30;stroke:#26374b;stroke-width:2}
.panel-a{fill:#111d30;stroke:#77e3c4;stroke-width:2.5}
.panel-d{fill:#111d30;stroke:#6f8196;stroke-width:2;stroke-dasharray:8 7}
.title{fill:#ecf2fa;font:700 30px Arial,Helvetica,sans-serif}
.h{fill:#77e3c4;font:700 17px Arial,Helvetica,sans-serif;letter-spacing:2px}
.t{fill:#ecf2fa;font:600 21px Arial,Helvetica,sans-serif}
.m{fill:#a9b8c9;font:500 19px Arial,Helvetica,sans-serif}
.a{fill:#77e3c4;font:700 21px Arial,Helvetica,sans-serif}
.code{fill:#ecf2fa;font:500 17px 'Courier New',Courier,monospace}
.note{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.arrow{stroke:#77e3c4;stroke-width:3;fill:none}
.arrow-d{stroke:#6f8196;stroke-width:3;fill:none;stroke-dasharray:6 6}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="500.0" y="52" class="title" text-anchor="middle">Two sources of click data</text>
<rect x="30" y="80" width="455" height="465" rx="14" class="panel-a"/>
<text x="257" y="118" class="h" text-anchor="middle">ON GOOGLE'S RESULTS PAGES</text>
<rect x="80" y="140" width="355" height="62" rx="10" class="panel"/>
<text x="257.5" y="178.0" class="t" text-anchor="middle" style="font-size:20px">Searchers click results</text>
<path d="M257.5 205 V229" class="arrow"/><path d="M249.5 220 L257.5 229 L265.5 220" class="arrow" style="stroke-dasharray:none"/>
<rect x="80" y="232" width="355" height="62" rx="10" class="panel"/>
<text x="257.5" y="257.0" class="t" text-anchor="middle" style="font-size:20px">Clicks aggregated by</text>
<text x="257.5" y="283.0" class="t" text-anchor="middle" style="font-size:20px">query and document</text>
<path d="M257.5 297 V321" class="arrow"/><path d="M249.5 312 L257.5 321 L265.5 312" class="arrow" style="stroke-dasharray:none"/>
<rect x="80" y="324" width="355" height="62" rx="10" class="panel"/>
<text x="257.5" y="349.0" class="t" text-anchor="middle" style="font-size:20px">Navboost: 13 months of</text>
<text x="257.5" y="375.0" class="t" text-anchor="middle" style="font-size:20px">click-and-query data</text>
<path d="M257.5 389 V413" class="arrow"/><path d="M249.5 404 L257.5 413 L265.5 404" class="arrow" style="stroke-dasharray:none"/>
<rect x="80" y="416" width="355" height="62" rx="10" class="panel"/>
<text x="257.5" y="454.0" class="t" text-anchor="middle" style="font-size:20px">Ranking</text>
<text x="257" y="522" class="a" text-anchor="middle" style="font-size:19px">Documented in US v. Google (2024)</text>
<rect x="515" y="80" width="455" height="465" rx="14" class="panel-d"/>
<text x="742" y="118" class="h" text-anchor="middle">ON YOUR WEBSITE</text>
<rect x="565" y="140" width="355" height="62" rx="10" class="panel"/>
<text x="742.5" y="178.0" class="m" text-anchor="middle" style="font-size:20px">Visitors land on a page</text>
<path d="M742.5 205 V229" class="arrow-d"/><path d="M734.5 220 L742.5 229 L750.5 220" class="arrow-d" style="stroke-dasharray:none"/>
<rect x="565" y="232" width="355" height="62" rx="10" class="panel"/>
<text x="742.5" y="257.0" class="m" text-anchor="middle" style="font-size:20px">Analytics tag records</text>
<text x="742.5" y="283.0" class="m" text-anchor="middle" style="font-size:20px">the session</text>
<path d="M742.5 297 V321" class="arrow-d"/><path d="M734.5 312 L742.5 321 L750.5 312" class="arrow-d" style="stroke-dasharray:none"/>
<rect x="565" y="324" width="355" height="62" rx="10" class="panel"/>
<text x="742.5" y="349.0" class="m" text-anchor="middle" style="font-size:20px">Bounce rate,</text>
<text x="742.5" y="375.0" class="m" text-anchor="middle" style="font-size:20px">engagement rate</text>
<path d="M742.5 389 V413" class="arrow-d"/><path d="M734.5 404 L742.5 413 L750.5 404" class="arrow-d" style="stroke-dasharray:none"/>
<rect x="565" y="416" width="355" height="62" rx="10" class="panel"/>
<text x="742.5" y="454.0" class="m" text-anchor="middle" style="font-size:20px">Your reports</text>
<text x="742" y="522" class="m" text-anchor="middle" style="font-size:19px">Google says this is not used for ranking</text>
</svg>

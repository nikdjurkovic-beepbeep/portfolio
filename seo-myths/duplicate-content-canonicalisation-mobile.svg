<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1038" width="600" height="1038" role="img" aria-labelledby="t d">
<title id="t">Duplicate URLs are clustered, not penalised</title>
<desc id="d">Four URL variants of the same page: http://example.com/shoes/, https://example.com/shoes/, https://example.com/shoes/?ref=email, https://example.com/shoes/?sort=price. Google groups them into a duplicate cluster and selects one canonical URL, https://example.com/shoes/, to show in search results. The other variants are filtered from results, not penalised. Redirects, rel=canonical, sitemaps and HTTPS inform the choice. Action is reserved for duplication meant to deceive, such as scraped content.</desc>
<style>
.bg{fill:#0e192a}
.panel{fill:#111d30;stroke:#26374b;stroke-width:2}
.panel-a{fill:#111d30;stroke:#77e3c4;stroke-width:2.5}
.panel-d{fill:#111d30;stroke:#6f8196;stroke-width:2;stroke-dasharray:8 7}
.title{fill:#ecf2fa;font:700 30px Arial,Helvetica,sans-serif}
.h{fill:#77e3c4;font:700 17px Arial,Helvetica,sans-serif;letter-spacing:2px}
.t{fill:#ecf2fa;font:600 21px Arial,Helvetica,sans-serif}
.m{fill:#a9b8c9;font:500 19px Arial,Helvetica,sans-serif}
.a{fill:#77e3c4;font:700 21px Arial,Helvetica,sans-serif}
.code{fill:#ecf2fa;font:500 17px 'Courier New',Courier,monospace}
.note{fill:#a9b8c9;font:500 17px Arial,Helvetica,sans-serif}
.arrow{stroke:#77e3c4;stroke-width:3;fill:none}
.arrow-d{stroke:#6f8196;stroke-width:3;fill:none;stroke-dasharray:6 6}
</style>
<rect width="100%" height="100%" class="bg"/>
<text x="300.0" y="50" class="title" text-anchor="middle" style="font-size:31px">Duplicate URLs are clustered,</text>
<text x="300.0" y="88" class="title" text-anchor="middle" style="font-size:31px">not penalised</text>
<text x="300.0" y="135" class="h" text-anchor="middle" style="font-size:20px">URL VARIANTS</text>
<rect x="30" y="152" width="540" height="56" rx="12" class="panel"/>
<text x="300.0" y="188" class="code" text-anchor="middle" style="font-size:21px">http://example.com/shoes/</text>
<rect x="30" y="218" width="540" height="56" rx="12" class="panel"/>
<text x="300.0" y="254" class="code" text-anchor="middle" style="font-size:21px">https://example.com/shoes/</text>
<rect x="30" y="284" width="540" height="56" rx="12" class="panel"/>
<text x="300.0" y="320" class="code" text-anchor="middle" style="font-size:21px">https://example.com/shoes/?ref=email</text>
<rect x="30" y="350" width="540" height="56" rx="12" class="panel"/>
<text x="300.0" y="386" class="code" text-anchor="middle" style="font-size:21px">https://example.com/shoes/?sort=price</text>
<path d="M300.0 418 V456" class="arrow"/><path d="M292.0 447 L300.0 456 L308.0 447" class="arrow" style="stroke-dasharray:none"/>
<rect x="150" y="464" width="300" height="70" rx="12" class="panel"/>
<text x="300.0" y="508" class="t" text-anchor="middle" style="font-size:25px">Duplicate cluster</text>
<path d="M300.0 536 V574" class="arrow"/><path d="M292.0 565 L300.0 574 L308.0 565" class="arrow" style="stroke-dasharray:none"/>
<rect x="30" y="582" width="540" height="110" rx="12" class="panel-a"/>
<text x="300.0" y="618" class="h" text-anchor="middle" style="font-size:20px">CANONICAL</text>
<text x="300.0" y="652" class="a" text-anchor="middle" style="font-size:26px">/shoes/ (HTTPS)</text>
<text x="300.0" y="680" class="m" text-anchor="middle" style="font-size:21px">Shown in results</text>
<rect x="30" y="707" width="540" height="110" rx="12" class="panel-d"/>
<text x="300.0" y="743" class="h" text-anchor="middle" style="font-size:20px">OTHER VARIANTS</text>
<text x="300.0" y="777" class="t" text-anchor="middle" style="font-size:25px">Filtered from results</text>
<text x="300.0" y="805" class="m" text-anchor="middle" style="font-size:21px">Not penalised</text>
<text x="40" y="862" class="m" text-anchor="start" style="font-size:22px">Signals that inform the choice:</text>
<text x="40" y="894" class="t" text-anchor="start" style="font-size:22px">redirects · rel=canonical · sitemaps · HTTPS</text>
<text x="40" y="940" class="m" text-anchor="start" style="font-size:22px">When action is taken:</text>
<text x="40" y="972" class="t" text-anchor="start" style="font-size:22px">duplication meant to deceive,</text>
<text x="40" y="1002" class="t" text-anchor="start" style="font-size:22px">e.g. scraped content</text>
</svg>
